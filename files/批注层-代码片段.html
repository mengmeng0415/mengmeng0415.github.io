<script id="anno-data" type="application/json">[]</script>

  .anno-view{padding:12px 14px;overflow:auto;flex:1;min-height:0}
  .anno-nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid #eef0f4;background:#fafbfc}
  .anno-nav button{border:1px solid #e5e8ee;background:#fff;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer;color:#4b5563}
  .anno-nav button:hover{background:#f2f4f7;color:#1f2329}

  .anno-view h5,.anno-card .bd h5{font-size:13px;margin:6px 0;color:#4b5563}

  .anno-over{position:fixed;inset:0;background:#f3f5f8;overflow:auto;padding:0 0 40px}

  .anno-over .oh h3{margin:0;font-size:15px}.anno-over .oh .sp{flex:1}
  .anno-over .oh button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:6px;padding:7px 13px;font:inherit;cursor:pointer}

  .anno-card .ch b{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center}
  .anno-card .ch em{font-style:normal;color:#8a9099;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anno-card .cb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .anno-card .snap{padding:14px;border-right:1px solid #eef0f4;background:#fbfcfd;overflow:hidden}
  .anno-card .snap .cap{font-size:12px;color:#8a9099;margin-bottom:8px}
  .anno-card .snap .el{border:1.5px dashed;border-radius:4px;padding:8px;max-height:260px;overflow:hidden;background:#fff;pointer-events:none}
  .anno-card .bd{padding:14px;min-width:0;word-break:break-word}
  @media (max-width:720px){.anno-card .cb{grid-template-columns:1fr}.anno-card .snap{border-right:0;border-bottom:1px solid #eef0f4}}
  .anno-lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;cursor:zoom-out;padding:24px}
  .anno-lb img{max-width:96%;max-height:96%;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px}

  @media print{
    html,body{height:auto!important;overflow:visible!important}
    body.anno-print>*{display:none!important}
    body.anno-print>#anno-root{display:block!important;position:static!important;z-index:auto}
    body.anno-print #anno-root>*:not(.anno-over){display:none!important}
    body.anno-print .anno-over{position:static!important;background:#fff;overflow:visible;padding:0}
    body.anno-print .anno-over .oh{display:none!important}
    body.anno-print .anno-card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;margin:0 0 14px}
  }
</style>
<script>
(function(){
  var STORE=document.getElementById('anno-data');
  var RO=STORE.getAttribute('data-mode')==='readonly';
  var raw=null; try{ raw=JSON.parse(STORE.textContent||'[]') }catch(e){ raw=null }
  var data=Array.isArray(raw)?raw:((raw&&raw.list)||[]);
  var PREF=(raw&&!Array.isArray(raw)&&raw.pref)?raw.pref:null;
  var PINS=['#ff7a45','#d4380d','#3478f6','#13a97b','#722ed1','#6b7280'];
  var PALETTES=[
    {n:'常用',   c:PINS},
    {n:'晨曦',   c:['#e8756b','#e8a06b','#9dc7ae','#a8dcdc','#7fc4ee','#d48fe0']},
    {n:'彩虹',   c:['#f5d033','#a8c23a','#d9e4c4','#4e9b93','#e2703a','#3b4a7a']},
    {n:'活力',   c:['#ffffff','#f0f0f0','#e03a24','#e8b024','#2340cc','#111111']},
    {n:'舞动',   c:['#5c63e8','#d9534f','#ffffff','#fbf3dc','#a02b2b','#33302e']},
    {n:'代码',   c:['#f5e9b0','#c6efb6','#ffffff','#c88fe8','#93c5f0','#33383d']},
    {n:'和风',   c:['#ffffff','#ee9a96','#e8763b','#9dc4f0','#4a55d6','#1f1f5c']},
    {n:'岛屿',   c:['#eddcc4','#c9ac94','#b08a72','#a9b3a0','#8e9682','#6b7355']},
    {n:'玫瑰',   c:['#fbeef0','#f4c8d5','#f2a0b5','#e0637f','#c2344f','#8e1f3c']},
    {n:'薄荷',   c:['#ffffff','#dbf7f2','#a9e5df','#7fd3cc','#3fa39b','#1e6360']},
    {n:'绿茶',   c:['#cfd5be','#a8a88c','#5c7a54','#4a5d33','#38452a','#232b1a']}
  ];
  if(!PREF||!PREF.c) PREF={g:'常用',c:PINS[0]};
  data=data.filter(function(a){ return a&&typeof a==='object' });
  data.forEach(function(a,i){                       /* 兼容 v1–v9 及手工编辑过的数据 */
    if(a.html==null){                               /* v1：纯文本字段 */
      var t=(a.text!=null?a.text:(a.note!=null?a.note:(a.content!=null?a.content:'')));
      a.html=t?('<p>'+String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/\n/g,'<br>')+'</p>'):'';
    }
    delete a.text; delete a.note; delete a.content;
    if(typeof a.sel!=='string'&&typeof a.selector==='string'){ a.sel=a.selector; delete a.selector }
    if(typeof a.color!=='string'||!/^#|^rgb/.test(a.color)) a.color=PINS[0];
    if(!a.id) a.id='a'+Date.now().toString(36)+'_'+i;
    a.n=i+1;                                        /* 编号一律按顺序重排，避免旧数据重号 */
    a.rx=Math.max(-1.2,Math.min(2.2,+a.rx||0.5));
    a.ry=Math.max(-1.2,Math.min(2.2,+a.ry||0.5));
    a.w=Math.max(320,+a.w||560); a.h=Math.max(220,+a.h||460);
    if(!Array.isArray(a.trail)) a.trail=[];
  });
  seq=data.length;
  function group(n){ for(var i=0;i<PALETTES.length;i++) if(PALETTES[i].n===n) return PALETTES[i]; return PALETTES[0] }
  function serialize(){ return JSON.stringify({pref:PREF,list:data},null,2) }
  var W0=560,H0=460;
  var mode=false, showList=true, showBox=!RO, sel=null, pop=null, over=null, EDCARET=null;
  var seq=data.reduce(function(m,a){return Math.max(m,a.n||0)},0), pins=[], boxes=[];
  var PINNED={on:false,l:0,t:0,w:560,h:460};        /* 固定弹窗位置与大小（两种模式通用） */

  var root=document.createElement('div'); root.id='anno-root'; document.body.appendChild(root);
  var bar=document.createElement('div'); bar.className='anno-bar pe';
  bar.innerHTML='<span class="grip" title="拖动移动工具条">⠿</span>'+ (RO
    ? '<b>批注（只读）</b><span class="cnt" id="annoCnt">0</span><button id="annoList">清单</button><button id="annoBox">虚线框</button><button id="annoOver">🗂 全览</button>'
    : '<button id="annoMode">✚ 批注模式</button><button id="annoList">清单</button><button id="annoBox" class="on">虚线框</button><button id="annoOver">🗂 全览</button><span class="cnt" id="annoCnt">0</span>'+
      '<button id="annoExp">⬇ 可继续批注</button><button id="annoExpRO">⬇ 只读版</button>');
  root.appendChild(bar);
  var panel=document.createElement('div'); panel.className='anno-panel pe';
  panel.innerHTML='<div class="hd">批注清单<span id="annoCnt2"></span></div><div class="ls" id="annoLs"></div>';
  root.appendChild(panel);
  var tip=document.createElement('div'); tip.className='anno-tip'; tip.style.display='none';
  tip.textContent='批注模式：单击选中元素 · 按住拖动可框选区域 · Esc 退出'; root.appendChild(tip);
  floatFree(bar,bar.querySelector('.grip')); floatFree(panel,panel.querySelector('.hd'));
  function floatFree(el,handle){
    drag(handle,function(dx,dy,s){
      el.style.transform='none';
      el.style.left=Math.max(0,Math.min(innerWidth-60,s.l+dx))+'px';
      el.style.top=Math.max(0,Math.min(innerHeight-30,s.t+dy))+'px';
    },function(){ var r=el.getBoundingClientRect(); return {l:r.left,t:r.top} });
  }

  /* ---------- 工具 ---------- */
  function pathOf(el){
    if(!el||el===document.body) return 'body';
    var p=[];
    while(el&&el!==document.body&&el.nodeType===1){
      var i=1,s=el; while(s=s.previousElementSibling){ if(s.tagName===el.tagName) i++ }
      p.unshift(el.tagName.toLowerCase()+':nth-of-type('+i+')'); el=el.parentElement;
    }
    return 'body>'+p.join('>');
  }
  function resolve(a){ try{ return document.querySelector(a.sel) }catch(e){ return null } }
  function rectOf(a){                                  /* 元素批注=元素框；区域批注=容器内的相对矩形 */
    var el=resolve(a); if(!el) return null;
    var r=el.getBoundingClientRect();
    if(a.type!=='area') return r;
    var L=r.left+r.width*(a.ax||0), T=r.top+r.height*(a.ay||0);
    var W=r.width*(a.aw||0), H=r.height*(a.ah||0);
    return {left:L,top:T,width:W,height:H,right:L+W,bottom:T+H};
  }
  function labelOf(el){
    var t=(el.textContent||'').replace(/\s+/g,' ').trim();
    var c=(typeof el.className==='string'&&el.className.trim())?'.'+el.className.trim().split(/\s+/)[0]:'';
    return el.tagName.toLowerCase()+c+(t?' 「'+t.slice(0,18)+'」':'');
  }
  function plain(h){ var d=document.createElement('div'); d.innerHTML=h||'';
    var t=(d.textContent||'').replace(/\s+/g,' ').trim();
    return t || (/<img/i.test(h||'')?'[图片]':'') || (/<table/i.test(h||'')?'[表格]':'') }
  function dark(hex){

        root.appendChild(bx); boxes.push(bx);
      }
      var x=r.left+r.width*(a.rx||0), y=r.top+r.height*(a.ry||0);
      x=Math.min(Math.max(x,c.l+11),c.r-11); y=Math.min(Math.max(y,c.t+11),c.b-11);
      var p=document.createElement('div'); p.className='anno-pin pe'+(sel===a.id?' sel':'');

      p.title=(RO?'':'拖动可挪开，避免遮挡元素\n')+plain(a.html);

          e.preventDefault(); e.stopPropagation();

          var rr=rectOf(a); if(!rr) return;
          var w=rr.width||1, h=rr.height||1;
          var r0=a.rx||0, y0=a.ry||0;
          p.style.cursor='grabbing';

            var dx=ev.clientX-sx, dy=ev.clientY-sy;

      m.appendChild(rm);
    });

    menu(pop.querySelector('#annoTbl'),function(m){
      var g=document.createElement('div'); g.className='anno-grid';
      var lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent='拖动选择行列';
      var R=8,C=10,cells=[];
      for(var r=0;r<R;r++) for(var c=0;c<C;c++){
        var i=document.createElement('i'); i.dataset.r=r; i.dataset.c=c; cells.push(i); g.appendChild(i);
        i.onmouseenter=function(){
          var rr=+this.dataset.r, cc=+this.dataset.c;
          cells.forEach(function(x){ x.className=(+x.dataset.r<=rr&&+x.dataset.c<=cc)?'on':'' });
          lbl.textContent=(rr+1)+' 行 × '+(cc+1)+' 列';
        };
        i.onclick=function(){
          var rr=+this.dataset.r+1, cc=+this.dataset.c+1, h='<table><tr>';
          for(var j=0;j<cc;j++) h+='<th>标题'+(j+1)+'</th>';
          h+='</tr>';
          for(var k=1;k<rr;k++){ h+='<tr>'; for(var j2=0;j2<cc;j2++) h+='<td><br></td>'; h+='</tr>' }
          ins(h+'</table><p><br></p>'); m.remove();
        };
      }
      m.appendChild(g); m.appendChild(lbl);
    });

    var fi=document.createElement('input'); fi.type='file'; fi.accept='image/*';
    function imgFile(f){ var r=new FileReader(); r.onload=function(){ ins('<img src="'+r.result+'" style="width:340px">') }; r.readAsDataURL(f) }
    var ib=pop.querySelector('#annoImg');
    ib.onmousedown=function(e){ e.preventDefault(); remember() };
    ib.onclick=function(){ fi.value=''; fi.click() };
    fi.onchange=function(){ if(fi.files[0]) imgFile(fi.files[0]) };
    ed.addEventListener('paste',function(e){
      var it=(e.clipboardData||{}).items||[];
      for(var i=0;i<it.length;i++) if(it[i].type.indexOf('image')===0){ e.preventDefault(); imgFile(it[i].getAsFile()); return }
    });
    ed.addEventListener('drop',function(e){
      var f=(e.dataTransfer||{}).files; if(f&&f[0]&&/image/.test(f[0].type)){ e.preventDefault(); imgFile(f[0]) }
    });
    ed.addEventListener('click',function(e){
      Array.prototype.forEach.call(ed.querySelectorAll('img.sel'),function(i){ i.classList.remove('sel') });
      if(e.target.tagName==='IMG'){ e.target.classList.add('sel'); showIH(e.target) } else hideIH();
    });
    ed.addEventListener('keydown',function(e){
      if(e.key!=='Enter'||e.shiftKey||e.isComposing) return;
      var cal=caretIn('.anno-cal'); if(!cal) return;
      if(caretIn('li')) return;                       /* 块内列表交给浏览器 */
      e.preventDefault(); e.stopPropagation();
      document.execCommand('insertParagraph');
      if(caretIn('.anno-cal')) return;                /* 正常留在块内 */
      var s=getSelection(); if(!s||!s.rangeCount) return;
      var n=s.getRangeAt(0).startContainer; n=n.nodeType===1?n:n.parentNode;
      var blk2=n.closest?(n.closest('p,div,h1,h2,h3,h4,h5')||n):n;
      if(blk2&&blk2!==ed&&cal.parentNode){            /* 被浏览器挤出去了，塞回块内 */
        cal.appendChild(blk2);
        var r=document.createRange(); r.selectNodeContents(blk2); r.collapse(true);
        s.removeAllRanges(); s.addRange(r);
      }
      remember();
    },true);
    ed.addEventListener('keyup',syncBlk); ed.addEventListener('mouseup',syncBlk);
    ed.addEventListener('scroll',function(){ var s=ed.querySelector('img.sel'); s?showIH(s):hideIH(); if(tCell) posTBar() });
    function syncBlk(){ var b=document.queryCommandValue('formatBlock')||'p'; blk.value=/h[1-5]/i.test(b)?b.toLowerCase():'p' }

    ed.addEventListener('mouseover',function(e){
      var c=e.target.closest&&e.target.closest('td,th');
      if(c&&ed.contains(c)) showTBar(c,ed);
    });
    ed.addEventListener('mouseleave',function(){ lazyHide() });
    ed.addEventListener('mousemove',function(e){
      var c=e.target.closest&&e.target.closest('td,th'); if(!c){ ed.style.cursor=''; return }
      ed.style.cursor=(c.getBoundingClientRect().right-e.clientX<6)?'col-resize':'';
    });
    ed.addEventListener('mousedown',function(e){
      var c=e.target.closest&&e.target.closest('td,th'); if(!c) return;
      var rc=c.getBoundingClientRect(); if(rc.right-e.clientX>=6) return;
      e.preventDefault();
      var t=c.closest('table'), i=c.cellIndex, sx=e.clientX, sw=rc.width;
      function mv(ev){ var w=Math.max(28,sw+ev.clientX-sx);
        Array.prototype.forEach.call(t.rows,function(row){ if(row.cells[i]) row.cells[i].style.width=w+'px' }) }
      function up(){ document.removeEventListener('mousemove',mv,true); document.removeEventListener('mouseup',up,true) }
      document.addEventListener('mousemove',mv,true); document.addEventListener('mouseup',up,true);
    });

    pop.querySelector('.save').onclick=function(){ finish(true) };
    pop.querySelector('.cancel').onclick=function(){ finish(false) };
    pop.querySelector('.del').onclick=function(){ if(confirm('删除该批注？')) remove(a) };
    ed.focus(); remember();
  }

  /* ---------- 表格操作条：以光标所在单元格为基准 ---------- */
  var tbar=null, tCell=null, tEd=null, tHover=false, tTimer=null;
  function target(){
    if(!tCell) return null;
    var t=tCell.closest('table');
    if(EDCARET&&t&&EDCARET.closest('table')===t&&document.contains(EDCARET)) return EDCARET;
    return tCell;
  }
  function paintTarget(){
    if(!tEd) return;
    Array.prototype.forEach.call(tEd.querySelectorAll('.curc'),function(n){ n.classList.remove('curc') });
    Array.prototype.forEach.call(tEd.querySelectorAll('tr.cur'),function(n){ n.classList.remove('cur') });
    var c=target(); if(!c) return;
    c.classList.add('curc');
    if(c.parentNode&&c.parentNode.classList) c.parentNode.classList.add('cur');
    if(tbar){
      var lb=tbar.querySelector('.lb');
      lb.textContent='第'+(c.parentNode.rowIndex+1)+'行 第'+(c.cellIndex+1)+'列'+(c===EDCARET?'（光标）':'（悬停）');
    }
  }
  function showTBar(c,ed){
    clearTimeout(tTimer); tCell=c; tEd=ed;
    if(!tbar){
      tbar=document.createElement('div'); tbar.className='anno-tbar pe';
      tbar.innerHTML='<span class="lb"></span><button data-a="ru">＋↑行</button><button data-a="rd">＋↓行</button><button data-a="rx">✕行</button>'+
        '<span class="sp"></span><button data-a="cl">＋←列</button><button data-a="cr">＋列→</button><button data-a="cx">✕列</button>'+
        '<span class="sp"></span><button data-a="tx">✕表</button>';
      tbar.onmousedown=function(e){ e.preventDefault() };
      tbar.onclick=function(e){ var b=e.target.closest('button'); if(b) act(b.dataset.a) };
      tbar.onmouseenter=function(){ tHover=true; clearTimeout(tTimer) };
      tbar.onmouseleave=function(){ tHover=false; lazyHide() };
      root.appendChild(tbar);
    }
    tbar.style.display='flex'; paintTarget(); posTBar();
  }
  function posTBar(){
    if(!tbar||!tCell||!tEd) return;
    var t=tCell.closest('table'); if(!t){ hideTBar(); return }
    var r=t.getBoundingClientRect(), er=tEd.getBoundingClientRect();
    if(r.bottom<er.top||r.top>er.bottom){ tbar.style.display='none'; return }
    tbar.style.display='flex';
    tbar.style.left=Math.max(4,Math.min(r.left,innerWidth-tbar.offsetWidth-8))+'px';
    tbar.style.top=Math.max(4,Math.min(r.top-32,er.bottom-32))+'px';
  }
  function lazyHide(){ clearTimeout(tTimer); tTimer=setTimeout(function(){ if(!tHover) hideTBar() },400) }
  function hideTBar(){
    if(tEd){
      Array.prototype.forEach.call(tEd.querySelectorAll('.curc'),function(n){ n.classList.remove('curc') });
      Array.prototype.forEach.call(tEd.querySelectorAll('tr.cur'),function(n){ n.classList.remove('cur') });
    }
    tCell=null; if(tbar) tbar.style.display='none';
  }
  function act(k){
    var c=target(); if(!c) return;
    var tr=c.parentNode, t=c.closest('table'), i=c.cellIndex;
    function blank(row,idx,tag){ var e=document.createElement(tag); e.innerHTML='<br>'; row.insertBefore(e,row.children[idx]||null) }
    function newRow(ref,after){
      var n=document.createElement('tr');
      for(var j=0;j<ref.cells.length;j++){ var td=document.createElement('td'); td.innerHTML='<br>'; n.appendChild(td) }
      ref.parentNode.insertBefore(n,after?ref.nextSibling:ref);
    }
    if(k==='ru'){ newRow(tr,false); paintTarget(); posTBar(); return }
    if(k==='rd'){ newRow(tr,true); paintTarget(); posTBar(); return }
    if(k==='rx'){ if(t.rows.length>1) tr.remove(); else t.remove(); EDCARET=null; hideTBar(); return }
    if(k==='cl'){ Array.prototype.forEach.call(t.rows,function(r2){ blank(r2,i,r2.rowIndex===0?'th':'td') }); paintTarget(); posTBar(); return }
    if(k==='cr'){ Array.prototype.forEach.call(t.rows,function(r2){ blank(r2,i+1,r2.rowIndex===0?'th':'td') }); paintTarget(); posTBar(); return }
    if(k==='cx'){
      if(t.rows[0].cells.length<=1) t.remove();
      else Array.prototype.forEach.call(t.rows,function(r2){ if(r2.cells[i]) r2.cells[i].remove() });
      EDCARET=null; hideTBar(); return;
    }
    if(k==='tx'){ t.remove(); EDCARET=null; hideTBar() }
  }

  /* ---------- 图片手柄 / 灯箱 ---------- */
  var ih=null, ihImg=null;
  function showIH(img){
    ihImg=img;
    if(!ih){ ih=document.createElement('div'); ih.className='anno-ih pe'; root.appendChild(ih);
      drag(ih,function(dx,dy,s){ if(!ihImg) return;
        ihImg.style.width=Math.max(40,s.w+dx)+'px'; ihImg.style.height='auto'; posIH() },
        function(){ return {w:ihImg.offsetWidth} }); }
    ih.style.display='block'; posIH();
  }
  function posIH(){ if(!ih||!ihImg) return; var r=ihImg.getBoundingClientRect();
    ih.style.left=(r.right-6)+'px'; ih.style.top=(r.bottom-6)+'px' }
  function hideIH(){ if(ih) ih.style.display='none'; ihImg=null }
  function lightbox(src){
    var lb=document.createElement('div'); lb.className='anno-lb pe';
    lb.innerHTML='<img>'; lb.querySelector('img').src=src;
    lb.onclick=function(){ lb.remove() };
    root.appendChild(lb);
  }
  function drag(handle,move,start){
    handle.addEventListener('mousedown',function(e){
      e.preventDefault(); e.stopPropagation();
      var sx=e.clientX, sy=e.clientY, s=start();
      function mv(ev){ move(ev.clientX-sx, ev.clientY-sy, s) }
      function up(){ document.removeEventListener('mousemove',mv,true); document.removeEventListener('mouseup',up,true) }
      document.addEventListener('mousemove',mv,true); document.addEventListener('mouseup',up,true);
    });
  }
  function remove(a){
    data=data.filter(function(x){ return x!==a });
    data.forEach(function(x,i){ x.n=i+1 }); seq=data.length; closePop(); save();
  }

  /* ---------- 全览 ---------- */
  function openOver(){
    closePop();
    over=document.createElement('div'); over.className='anno-over pe';
    var hd=document.createElement('div'); hd.className='oh';
    hd.innerHTML='<h3>批注全览 · '+data.length+' 条</h3><span class="sp"></span>'+
      '<button id="annoPdf">⬇ 下载 PDF</button><button id="annoOverX">关闭</button>';
    over.appendChild(hd);
    if(!data.length){ var e0=document.createElement('div'); e0.className='anno-empty'; e0.textContent='暂无批注'; over.appendChild(e0) }
    data.forEach(function(a){
      var col=a.color||PINS[0];
      var card=document.createElement('div'); card.className='anno-card';
      card.innerHTML='<div class="ch"><b></b><em></em></div><div class="cb">'+
        '<div class="snap"><div class="cap"></div><div class="el"></div></div><div class="bd"></div></div>';
      card.querySelector('.cap').textContent=(a.type==='area'?'框选区域所在容器':'被批注元素');
      var b=card.querySelector('b'); b.textContent=a.n; paint(b,col);
      card.querySelector('em').textContent=a.label||'';
      var slot=card.querySelector('.el'); slot.style.borderColor=col;
      var el=resolve(a);
      if(el){
        var cl=el.cloneNode(true);
        Array.prototype.forEach.call(cl.querySelectorAll('[id]'),function(n){ n.removeAttribute('id') });
        cl.removeAttribute('id');
        if(cl.classList) cl.classList.remove('anno-hover','anno-flash');
        slot.appendChild(cl);
      } else slot.innerHTML='<span style="color:#b7bcc4">元素已不存在</span>';
      card.querySelector('.bd').innerHTML=a.html||'<span style="color:#b7bcc4">（空）</span>';
      over.appendChild(card);
    });
    over.addEventListener('click',function(e){ if(e.target.tagName==='IMG'&&e.target.closest('.bd')) lightbox(e.target.src) });
    root.appendChild(over); draw();
    hd.querySelector('#annoOverX').onclick=closeOver;
    hd.querySelector('#annoPdf').onclick=function(){
      document.body.classList.add('anno-print');
      setTimeout(function(){ print(); setTimeout(function(){ document.body.classList.remove('anno-print') },400) },60);
    };
  }
  function closeOver(){ if(over){ over.remove(); over=null; draw() } }
  function go(a,dir){                                /* 只读：切上一条 / 下一条 */
    var i=data.indexOf(a); if(i<0||data.length<2) return;
    focusOn(data[(i+dir+data.length)%data.length]);
  }

  /* ---------- 取点 ---------- */
  var last=null;
  function clearHover(){ if(last){ last.classList.remove('anno-hover'); last=null } }
  document.addEventListener('mouseover',function(e){
    if(!mode||root.contains(e.target)) return;
    clearHover(); last=e.target; last.classList.add('anno-hover');
  },true);
  function newId(){ return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
  function pickElement(el,cx,cy){
    var r=el.getBoundingClientRect();
    var a={ id:newId(), n:++seq, sel:pathOf(el), label:labelOf(el), html:'', color:PREF.c, w:W0, h:H0, trail:TRAIL.slice(),
            rx:r.width?(cx-r.left)/r.width:.5, ry:r.height?(cy-r.top)/r.height:.5 };
    data.push(a); save(); openPop(a,cx,cy);
  }
  function pickArea(l,t,w,h){
    var host=null, cx=l+w/2, cy=t+h/2;
    var stack=document.elementsFromPoint?document.elementsFromPoint(cx,cy):[document.elementFromPoint(cx,cy)];
    for(var i=0;i<stack.length&&!host;i++){
      var n=stack[i]; if(!n||root.contains(n)) continue;
      while(n&&n.nodeType===1&&n!==document.documentElement){
        var rr=n.getBoundingClientRect();
        if(rr.width&&rr.height&&rr.left<=l+1&&rr.top<=t+1&&rr.right>=l+w-1&&rr.bottom>=t+h-1){ host=n; break }
        n=n.parentElement;
      }
    }
    if(!host) host=document.body;
    var hr=host.getBoundingClientRect(), hw=hr.width||1, hh=hr.height||1;
    var cnt=0, txt='';
    Array.prototype.forEach.call(host.querySelectorAll('*'),function(n2){
      if(root.contains(n2)) return;
      var r2=n2.getBoundingClientRect();
      if(!r2.width||!r2.height) return;
      if(r2.left>=l-1&&r2.top>=t-1&&r2.right<=l+w+1&&r2.bottom<=t+h+1){
        cnt++;
        if(txt.length<24&&!n2.children.length) txt+=(n2.textContent||'').replace(/\s+/g,' ').trim()+' ';
      }
    });
    var a={ id:newId(), n:++seq, type:'area', sel:pathOf(host),
            label:'框选区域 · '+cnt+' 个元素'+(txt.trim()?' 「'+txt.trim().slice(0,18)+'」':''),
            html:'', color:PREF.c, w:W0, h:H0, trail:TRAIL.slice(),
            ax:(l-hr.left)/hw, ay:(t-hr.top)/hh, aw:w/hw, ah:h/hh, rx:1, ry:0 };
    data.push(a); save(); openPop(a,l+w,t);
  }
  var mqS=null, mq=null, mqMoved=false;
  document.addEventListener('mousedown',function(e){
    if(!mode||root.contains(e.target)||e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    mqS={x:e.clientX,y:e.clientY,t:e.target}; mqMoved=false;
  },true);
  document.addEventListener('mousemove',function(e){
    if(!mqS) return;
    var dx=e.clientX-mqS.x, dy=e.clientY-mqS.y;
    if(!mqMoved&&Math.abs(dx)<5&&Math.abs(dy)<5) return;
    mqMoved=true; clearHover();
    if(!mq){ mq=document.createElement('div'); mq.className='anno-mq'; root.appendChild(mq) }
    mq.style.left=Math.min(e.clientX,mqS.x)+'px'; mq.style.top=Math.min(e.clientY,mqS.y)+'px';
    mq.style.width=Math.abs(dx)+'px'; mq.style.height=Math.abs(dy)+'px';
  },true);
  document.addEventListener('mouseup',function(e){
    if(!mqS) return;
    var st=mqS; mqS=null;
    if(mq){ mq.remove(); mq=null }
    if(!mqMoved){ pickElement(st.t,e.clientX,e.clientY); return }
    var l=Math.min(e.clientX,st.x), t=Math.min(e.clientY,st.y),
        w=Math.abs(e.clientX-st.x), h=Math.abs(e.clientY-st.y);
    if(w>=8&&h>=8) pickArea(l,t,w,h);
  },true);
  document.addEventListener('click',function(e){
    if(!mode||root.contains(e.target)) return;
    e.preventDefault(); e.stopPropagation();
  },true);
  document.addEventListener('keydown',function(e){
    if(RO&&pop&&!over&&!root.querySelector('.anno-lb')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
      var cur=data.filter(function(x){ return x.id===sel })[0];
      if(cur){ e.preventDefault(); go(cur,e.key==='ArrowRight'?1:-1); return }
    }
    if(e.key!=='Escape') return;
    var lb=root.querySelector('.anno-lb');
    if(lb) lb.remove(); else if(over) closeOver(); else if(pop) closePop(); else setMode(false);
  });

  function setMode(v){
    mode=v; clearHover(); tip.style.display=v?'block':'none';
    var b=document.getElementById('annoMode'); if(!b) return;
    b.classList.toggle('on',v); b.textContent=v?'✕ 退出批注':'✚ 批注模式';
  }
  var bm=document.getElementById('annoMode'); if(bm) bm.onclick=function(){ setMode(!mode) };
  document.getElementById('annoList').onclick=function(){ showList=!showList; render() };
  var bb=document.getElementById('annoBox');
  bb.onclick=function(){ showBox=!showBox; bb.classList.toggle('on',showBox); draw() };
  document.getElementById('annoOver').onclick=function(){ over?closeOver():openOver() };

  function download(readonly){
    closePop(); closeOver();
    STORE.textContent=serialize();
    var c=document.documentElement.cloneNode(true);
    var rt=c.querySelector('#anno-root'); if(rt) rt.remove();
    Array.prototype.forEach.call(c.querySelectorAll('.anno-hover,.anno-flash'),function(n){ n.classList.remove('anno-hover','anno-flash') });
    var st=c.querySelector('#anno-data');
    readonly?st.setAttribute('data-mode','readonly'):st.removeAttribute('data-mode');
    var name=(document.title||'page')+(readonly?'_批注只读版':'_批注版')+'.html';
    var b=new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; a.click();
    setTimeout(function(){ URL.revokeObjectURL(u) },3000);
  }
  var e1=document.getElementById('annoExp'); if(e1) e1.onclick=function(){ download(false) };
  var e2=document.getElementById('annoExpRO'); if(e2) e2.onclick=function(){ download(true) };

  ['scroll','wheel'].forEach(function(ev){ document.addEventListener(ev,function(){ draw(); posIH(); posTBar() },true) });
  addEventListener('resize',function(){ draw(); posIH(); posTBar() });
  setInterval(function(){ draw(); posIH() },600);
  render();
})();
</script>
<!-- ============ 批注层 v16 结束 ============ -->
