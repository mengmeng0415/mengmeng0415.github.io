/* 找到旧批注层的起止位置 */
function layerRange(t){
  var starts=[
    /<!--\s*=+\s*通用批注层[\s\S]*?-->/,          /* v2+ */
    /<!--\s*=+\s*批注层[（(][\s\S]*?-->/           /* v1 */
  ];
  var i=-1;
  starts.forEach(function(re){var m=re.exec(t);if(m&&(i<0||m.index<i))i=m.index});
  if(i<0){ var j=t.indexOf('<script id="anno-data"'); if(j>=0) i=j; }
  if(i<0) return null;
  var endRe=/<!--\s*=+\s*批注层\s*v\d+\s*结束\s*=+\s*-->/;
  var m2=endRe.exec(t.slice(i));
  var end = m2 ? i+m2.index+m2[0].length : t.toLowerCase().indexOf('<\/body>',i);
  if(end<0) end=t.length;
  return {s:i,e:end};
}
function handle(files){
  Array.prototype.forEach.call(files,function(file){
    var r=new FileReader();
    r.onload=function(){
      var t=r.result, upgraded=false, data=null, ro=false;
      var tag=/<script id="anno-data"([^>]*)>([\s\S]*?)<\/script>/i.exec(t);
      if(tag){
        ro=/data-mode\s*=\s*["']readonly["']/i.test(tag[1]);
        data=tag[2].trim();
        var rg=layerRange(t);
        if(rg){ t=t.slice(0,rg.s)+t.slice(rg.e); upgraded=true; }
      }
      var layer=LAYER;
      if(data&&data!=='[]'&&data!==''){
        layer=layer.replace('<script id="anno-data" type="application/json">[]<\/script>',function(){
          return '<script id="anno-data" type="application/json"'+(ro?' data-mode="readonly"':'')+'>'+data+'<\/script>';
        });
      }else if(ro){
        layer=layer.replace('<script id="anno-data" type="application/json">',function(){
          return '<script id="anno-data" type="application/json" data-mode="readonly">';
        });
      }
      var out = /<\/body>/i.test(t) ? t.replace(/<\/body>/i, layer+'\n</body>') : t+layer;
      var base=file.name.replace(/\.html?$/i,'').replace(/_可批注$/,'');
      var b=new Blob([out],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');

      setTimeout(function(){URL.revokeObjectURL(u)},3000);
      var n=0; try{ var d=JSON.parse(data); n=Array.isArray(d)?d.length:((d&&d.list||[]).length) }catch(x){}
      log.textContent += (upgraded ? '✓ '+file.name+' 已升级到最新批注层，保留 '+n+' 条批注' : '✓ '+file.name+' 已注入批注层')+'\n';
    };
    r.readAsText(file,'utf-8');
  });
}
