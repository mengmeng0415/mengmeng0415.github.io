  /* ---------- 全局可见：项目内其它页面/文件的批注 ---------- */
  function parseDocId(id){                        /* "docId::pageKey::page" */
    var i1=id.indexOf('::'); if(i1<0) return {pageKey:'',page:'首页'};
    var rest=id.slice(i1+2), i2=rest.lastIndexOf('::');
    if(i2<0) return {pageKey:rest,page:'首页'};
    return {pageKey:rest.slice(0,i2), page:rest.slice(i2+2)};
  }
  function relativePath(fromPath,toPath){          /* 从当前文件所在目录跳到目标文件的相对路径 */
    var fromParts=fromPath.split('/'); fromParts.pop();
    var toParts=toPath.split('/'); var toFile=toParts.pop();
    var i=0;
    while(i<fromParts.length&&i<toParts.length&&fromParts[i]===toParts[i]) i++;
    var rel=[];
    for(var k=0;k<fromParts.length-i;k++) rel.push('..');
    for(var k=i;k<toParts.length;k++) rel.push(toParts[k]);
    rel.push(toFile);
    return rel.join('/');
  }
  function goToRemote(loc,a){
    if(loc.pageKey===SYNC.cfg.pageKey){            /* 同一个文件内的其它文档页面：目前还没有可编程切换的入口 */

    }
    var siblings=SYNC.cfg.siblings||{};
    var myPath=siblings[SYNC.cfg.pageKey], target=siblings[loc.pageKey];
    if(!target){ alert('找不到这条批注所在的文件（可能是旧版本注入的文件，没有记录兄弟文件路径）'); return; }
    var href=myPath?relativePath(myPath,target):target;
    location.href=href+'?annoFocus='+encodeURIComponent(a.id);
  }

  /* 从其它页面/文件跳转过来时，带着 ?annoFocus=<id> 落地后自动定位过去（数据可能还没同步回来，重试几次） */
  (function(){
    var m=/[?&]annoFocus=([^&]+)/.exec(location.search);
    if(!m) return;
    var targetId=decodeURIComponent(m[1]);
    var tries=0;
    (function tryFocus(){
      var found=null;
      for(var i=0;i<data.length;i++) if(data[i].id===targetId){ found=data[i]; break }
      if(found){ setTimeout(function(){ focusOn(found) },300); return }

  function floatFree(el,handle){
    drag(handle,function(dx,dy,s){
      if(el===bar) barMoved=true;
      el.style.transform='none'; el.style.right='auto';
      el.style.left=Math.max(0,Math.min(innerWidth-60,s.l+dx))+'px';
      el.style.top=Math.max(0,Math.min(innerHeight-30,s.t+dy))+'px';
    },function(){
      el.style.zIndex='2147483001';        /* 拖动期间置顶，分屏下也能拖 */
      var r=el.getBoundingClientRect(); return {l:r.left,t:r.top};
    },'move');
  }
  function placeBarDefault(force){

    if(!a) return;

  /* ---------- 工具 ---------- */
  function pathOf(el){
    if(!el||el===document.body) return 'body';
    var p=[];
    while(el&&el!==document.body&&el.nodeType===1){
      var i=1,s=el; while(s=s.previousElementSibling){ if(s.tagName===el.tagName) i++ }
      p.unshift(el.tagName.toLowerCase()+':nth-of-type('+i+')'); el=el.parentElement;
    }
    return 'body>'+p.join('>');
  }
  function resolve(a){ try{ return document.querySelector(a.sel) }catch(e){ return null } }
  function rectOf(a){                                  /* 元素批注=元素框；区域批注=容器内的相对矩形 */
    var el=resolve(a); if(!el) return null;
    var r=el.getBoundingClientRect();
    if(a.type!=='area') return r;
    var L=r.left+r.width*(a.ax||0), T=r.top+r.height*(a.ay||0);
    var W=r.width*(a.aw||0), H=r.height*(a.ah||0);
    return {left:L,top:T,width:W,height:H,right:L+W,bottom:T+H};
  }
  function labelOf(el){
    var t=(el.textContent||'').replace(/\s+/g,' ').trim();
    var c=(typeof el.className==='string'&&el.className.trim())?'.'+el.className.trim().split(/\s+/)[0]:'';
    return el.tagName.toLowerCase()+c+(t?' 「'+t.slice(0,18)+'」':'');
  }
  function plain(h){ var d=document.createElement('div'); d.innerHTML=h||'';
    var t=(d.textContent||'').replace(/\s+/g,' ').trim();
    return t || (/<img/i.test(h||'')?'[图片]':'') || (/<table/i.test(h||'')?'[表格]':'') }
  function annoHtmlIsEmpty(h){                 /* 判断批注是不是真的什么都没有：图片/表格/列表本身就算内容，不能光看有没有文字 */
    if(!h) return true;
    if(/<(img|table|hr)[\s\/>]/i.test(h)) return false;
    if(/<li[\s>]/i.test(h)) return false;
    return !h.replace(/<[^>]+>|&nbsp;|\s/g,'');
  }
  function dark(hex){
    var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return false;
    var v=parseInt(m[1],16), r=v>>16, g=(v>>8)&255, b=v&255;
    return (r*299+g*587+b*114)/1000 < 150;
  }
  function clipRect(el){
    var r={l:0,t:0,r:innerWidth,b:innerHeight}, p=el.parentElement;
    while(p&&p!==document.body){
      var st=getComputedStyle(p);
      if(/auto|scroll|hidden/.test(st.overflow+st.overflowX+st.overflowY)){
        var q=p.getBoundingClientRect();
        r.l=Math.max(r.l,q.left); r.t=Math.max(r.t,q.top); r.r=Math.min(r.r,q.right); r.b=Math.min(r.b,q.bottom);
      }
      p=p.parentElement;
    }
    return r;
  }
  /* 记录用户在原型上的点击足迹，供定位时重放，露出隐藏内容 */
  var TRAIL=[];
  document.addEventListener('click',function(e){
    if(mode||RO||root.contains(e.target)||!e.isTrusted) return;
    var n=e.target;
    var t=(n.closest&&n.closest('button,a,[onclick],[role=button],[data-target],[data-tab],label,li,tr,th,.tab,.btn'))||n;
    var sl=pathOf(t);
    if(!TRAIL.length||TRAIL[TRAIL.length-1]!==sl) TRAIL.push(sl);
    if(TRAIL.length>10) TRAIL.shift();
  },true);
  function shown(el){
    if(!el||!el.getClientRects||!el.getClientRects().length) return false;
    var st=getComputedStyle(el);
    return st.visibility!=='hidden'&&parseFloat(st.opacity||1)>0.05;
  }
  function reveal(a,done){                       /* 目标被隐藏时，按足迹重放点击把它点出来 */
    var el=resolve(a);
    if(el&&shown(el)) return done(el);
    var steps=(a.trail||[]).slice(), i=0;
    (function step(){
      var cur=resolve(a);
      if(cur&&shown(cur)) return done(cur);
      if(i>=steps.length) return done(cur||null);
      var t=null; try{ t=document.querySelector(steps[i]) }catch(e){}
      i++;
      if(t&&shown(t)&&!root.contains(t)){ try{ t.click() }catch(e){} setTimeout(step,180) }
      else step();
    })();
  }
  /* 被弹窗/抽屉/遮罩盖住时，底层批注不再浮在上面 */
  function hitOK(el,x,y){
    if(x<0||y<0||x>innerWidth||y>innerHeight) return false;
    var st=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(!n||root.contains(n)) continue;
      if(n===document.documentElement||n===document.body) return true;
      return n===el||el.contains(n)||n.contains(el);
    }
    return true;
  }
  function covered(el,px,py,cx,cy){ return !hitOK(el,px,py)&&!hitOK(el,cx,cy) }
  function save(){ STORE.textContent=serialize(); render(); if(SYNC) SYNC.push() }
  function save2(){ STORE.textContent=serialize(); if(SYNC) SYNC.push() }
  function paint(el,color){ el.style.background=color; el.style.color=dark(color)?'#fff':'#1f2329' }

  /* ---------- 清单 + 拖拽排序 ---------- */
  var dragId=null;
  function render(){
    document.getElementById('annoCnt').textContent=data.length;
    var c2=document.getElementById('annoCnt2');
    panel.style.display=showList?'flex':'none';
    var ls=document.getElementById('annoLs'); ls.innerHTML='';
    if(!data.length) ls.innerHTML='<div class="anno-empty">暂无批注'+(RO?'':'<br>选择「气泡批注」或「对照批注」后添加')+'</div>';
    var lost=0;
    data.forEach(function(a){
      var alive=!!resolve(a); if(!alive) lost++;
      var d=document.createElement('div'); d.className='anno-item'+(alive?'':' lost');
      d.innerHTML=(RO?'':'<span class="hn" title="拖动排序">⋮⋮</span>')+'<b></b><div class="tx"><p></p><em></em></div>';
      var b=d.querySelector('b'); b.textContent=a.n; paint(b,a.color||PINS[0]);
      var t=plain(a.html);
      d.querySelector('p').textContent=t||'（空）';
      var emEl=d.querySelector('em');
      emEl.textContent=(a.gn?('#'+a.gn+' · '):'')+(a.label||'');
      if(!alive){
        var hasTrail=a.trail&&a.trail.length;    /* 有足迹：很可能只是被收起的抽屉/弹窗/Tab 挡住，点击会自动展开找回来 */
        var w=document.createElement('span'); w.className='warn';
        w.textContent=hasTrail?'⚠ 可能需展开，点击定位':(RO?'⚠ 元素已变动':'⚠ 点此重新锚定');
        w.style.cursor='pointer';
        w.onclick=function(ev){ ev.stopPropagation(); focusOn(a) };
        emEl.appendChild(w);
      }
      d.title=t;
      d.onclick=function(){ focusOn(a) };
      if(!RO){ b.style.cursor='pointer'; b.title='双击修改编号';
        b.addEventListener('dblclick',function(ev){ ev.stopPropagation(); ev.preventDefault(); renumber(a) }) }
      if(!RO){
        d.draggable=true;
        d.addEventListener('dragstart',function(e){ dragId=a.id; d.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',a.id)}catch(x){} });
        d.addEventListener('dragend',function(){ dragId=null; d.classList.remove('dragging'); clearDrop() });
        d.addEventListener('dragover',function(e){
          if(!dragId||dragId===a.id) return;
          e.preventDefault(); clearDrop();
          var r=d.getBoundingClientRect();
          d.classList.add(e.clientY<r.top+r.height/2?'dropTop':'dropBot');
        });
        d.addEventListener('drop',function(e){
          e.preventDefault(); e.stopPropagation();
          var r=d.getBoundingClientRect();
          reorder(dragId,a.id,e.clientY<r.top+r.height/2); clearDrop();
        });
      }
      ls.appendChild(d);
    });
    if(c2) c2.innerHTML=data.length+' 条'+(lost?'<span class="lostn">· '+lost+' 条不在本页</span>':'');
    if(!RO){
      ls.ondragover=function(e){ if(dragId) e.preventDefault() };
      ls.ondrop=function(e){ if(dragId&&e.target===ls){ e.preventDefault(); reorder(dragId,null,false); clearDrop() } };
    }
    draw();
  }
  /* 单页应用的 tab 常常是"首次点开才挂载"，批注元素刚打开时可能确实还没渲染出来，
     并非真的被删——这里监听页面变化，一旦之前找不到的元素重新出现（比如用户点开了对应tab），
     自动刷新清单，把"元素已变动"的误报清掉，不用用户自己手动重新锚定 */
  var lastAliveKey='', renderWatchTimer=null;
  function aliveKey(){ return data.map(function(a){ return a.id+':'+(!!resolve(a)) }).join('|') }
  var aliveObserverStarted=false;
  function watchAliveChanges(){
    lastAliveKey=aliveKey();
    if(aliveObserverStarted) return;
    aliveObserverStarted=true;
    new MutationObserver(function(){
      clearTimeout(renderWatchTimer);
      renderWatchTimer=setTimeout(function(){
        var k=aliveKey();
        if(k!==lastAliveKey){ lastAliveKey=k; render() }
      },200);
    }).observe(document.body,{childList:true,subtree:true});
  }
  function clearDrop(){ Array.prototype.forEach.call(document.querySelectorAll('.anno-item'),function(n){ n.classList.remove('dropTop','dropBot') }) }
  function renumber(a){
    if(RO) return;
    var cur=data.indexOf(a)+1;
    var v=prompt('把 #'+cur+' 改为第几号？（1 - '+data.length+'）', String(cur));
    if(v==null) return;
    var n=parseInt(String(v).trim(),10);
    if(!n||n<1||n>data.length||n===cur) return;
    data.splice(data.indexOf(a),1);
    data.splice(n-1,0,a);
    data.forEach(function(x,i){ x.n=i+1 });
    seq=data.length; save();
    if(split){ refreshSplitList(); if(frameReady) drawFrame() }
  }
  function reorder(fromId,toId,before){
    var f=data.filter(function(x){ return x.id===fromId })[0]; if(!f) return;
    data=data.filter(function(x){ return x!==f });
    if(toId==null) data.push(f);
    else{
      var i=data.findIndex(function(x){ return x.id===toId });
      if(i<0) data.push(f); else data.splice(before?i:i+1,0,f);
    }
    data.forEach(function(x,i){ x.n=i+1 }); seq=data.length; save();
  }

  /* ---------- 圆点 / 虚线框 ---------- */
  function draw(){
    pins.forEach(function(p){ p.remove() }); pins=[];
    boxes.forEach(function(p){ p.remove() }); boxes=[];
    if(over) return;
    data.forEach(function(a){
      var el=resolve(a); if(!el) return;
      var r=rectOf(a); if(!r||(!r.width&&!r.height)) return;
      var c=clipRect(el), col=a.color||PINS[0];
      var vl=Math.max(r.left,c.l), vt=Math.max(r.top,c.t), vr=Math.min(r.right,c.r), vb=Math.min(r.bottom,c.b);
      if(vr<=vl||vb<=vt) return;
      var cur=(sel===a.id), editing=(boxEdit===a.id);
      var bx=null;
      if(showBox||cur||editing){
        bx=document.createElement('div'); bx.className='anno-box'+(cur?' cur':'')+(editing?' edit':'');
        bx.style.cssText+='left:'+vl+'px;top:'+vt+'px;width:'+(vr-vl)+'px;height:'+(vb-vt)+'px;border-color:'+col;
        root.appendChild(bx); boxes.push(bx);
        if(editing) wireBoxEdit(bx,a);
      }
      var x=r.left+r.width*(a.rx||0), y=r.top+r.height*(a.ry||0);
      x=Math.min(Math.max(x,c.l+11),c.r-11); y=Math.min(Math.max(y,c.t+11),c.b-11);
      if(covered(el,x,y,(vl+vr)/2,(vt+vb)/2)){
        if(bx&&boxes[boxes.length-1]===bx&&!editing){ bx.remove(); boxes.pop() }
        return;
      }
      if(!showPins&&!cur&&!editing) return;
      var p=document.createElement('div'); p.className='anno-pin pe'+(sel===a.id?' sel':'');
      p.textContent=a.n; paint(p,col); p.style.left=x+'px'; p.style.top=y+'px';
      p.title=(RO?'':'拖动可挪开 · 双击改编号\n')+plain(a.html);
      if(!RO) p.addEventListener('dblclick',function(ev){ ev.stopPropagation(); ev.preventDefault(); renumber(a) });
      if(RO){ p.onclick=function(e){ e.stopPropagation(); openPop(a,x,y) } }
      else{
        p.style.cursor='grab';
        p.addEventListener('mousedown',function(e){
          e.preventDefault(); e.stopPropagation();
          var sx=e.clientX, sy=e.clientY, moved=false;
          var rr=rectOf(a); if(!rr) return;
          var w=rr.width||1, h=rr.height||1;
          var r0=a.rx||0, y0=a.ry||0;
          p.style.cursor='grabbing';
          function mv(ev){
            var dx=ev.clientX-sx, dy=ev.clientY-sy;
            if(!moved&&Math.abs(dx)<4&&Math.abs(dy)<4) return;
            moved=true;
            a.rx=Math.max(-1.2,Math.min(2.2,r0+dx/w));
            a.ry=Math.max(-1.2,Math.min(2.2,y0+dy/h));
            draw();
          }
          function up(ev){
            document.removeEventListener('mousemove',mv,true);
            document.removeEventListener('mouseup',up,true);
            if(moved) save2();
            else openPop(a,ev.clientX,ev.clientY);
          }
          document.addEventListener('mousemove',mv,true);
          document.addEventListener('mouseup',up,true);
        });
      }
      root.appendChild(p); pins.push(p);
    });
  }
  function toArea(a){
    if(a.type==='area') return;
    a.type='area'; a.ax=0; a.ay=0; a.aw=1; a.ah=1;

  /* 快照：克隆整页上下文，用取景框只显示目标周边，可滚轮缩放 / 拖动平移 */

  }

  .edit-cal .grid .d.range{background:#eef4ff}
  .edit-cal .grid .d.sel{background:#3478f6;color:#fff}
  .edit-cal .grid .d.today{box-shadow:inset 0 0 0 1px #3478f6}
</style>
<script>
(function(){
  if(!annoShouldInitUI()) return;         /* 同样只在实际显示原型内容的那层文档初始化，跳过套壳/嵌套面板 */
  if(window.__editLayerInit) return;
  window.__editLayerInit = true;

  var STORE = document.getElementById('anno-data');
  var RO = STORE ? STORE.getAttribute('data-mode') === 'readonly' : false;
  if (RO) { return }

  var root = document.getElementById('anno-root');
  if (!root) {
    root = document.createElement('div'); root.id = 'anno-root';
    root.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:99999;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#1f2329';
    document.body.appendChild(root);
  }

  var bar = document.querySelector('.anno-bar');
  var ownBar = false;
  if (!bar) {
    bar = document.createElement('div'); bar.className = 'edit-bar pe';
    root.appendChild(bar); ownBar = true;
  }

  var editBtn = document.createElement('button'); editBtn.id = 'editMode'; editBtn.textContent = '✎ 编辑模式';
  var undoBtn = document.createElement('button'); undoBtn.id = 'editUndo'; undoBtn.title = '撤销'; undoBtn.textContent = '↶ 撤销'; undoBtn.disabled = true;
  var redoBtn = document.createElement('button'); redoBtn.id = 'editRedo'; redoBtn.title = '还原'; redoBtn.textContent = '↷ 还原'; redoBtn.disabled = true;

  var emode = false, esel = null, box = null, tbar = null, panel = null, palPanel = null;
  var dragKey = null, dropHint = null;

  var imgFileInput = document.createElement('input');
  imgFileInput.type = 'file'; imgFileInput.accept = 'image/*'; imgFileInput.className = 'pe';
  imgFileInput.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
  root.appendChild(imgFileInput);
  imgFileInput.addEventListener('change', function(){
    var f = imgFileInput.files[0];
    if (!f || !esel) { imgFileInput.value = ''; return }
    pushUndo();
    var reader = new FileReader();
    reader.onload = function(){
      esel.style.backgroundImage = 'url(' + reader.result + ')';
      esel.textContent = '';
      imgFileInput.value = '';
    };
    reader.readAsDataURL(f);
  });

  function inRoot(el){ return !!el && root.contains(el) }
  function isFreePos(el){ var p = getComputedStyle(el).position; return p === 'absolute' || p === 'fixed' }

  function pathOf(el){
    if (!el || el === document.body) return 'body';
    var p = [];
    while (el && el !== document.body && el.nodeType === 1) {
      var i = 1, s = el; while (s = s.previousElementSibling) { if (s.tagName === el.tagName) i++ }
      p.unshift(el.tagName.toLowerCase() + ':nth-of-type(' + i + ')'); el = el.parentElement;
    }
    return 'body>' + p.join('>');
  }

  /* ---------- 编辑内容防丢失：React/Vue 等框架重渲染会覆盖手动改的DOM，这里记住每处编辑，
     一旦发现被外部改回去就自动补写回来，不需要用户编辑完立刻下载 ---------- */
  var stickyEdits = {}, stickyTimer = null;
  function protectEdit(el){
    if (!el) return;
    try{ stickyEdits[pathOf(el)] = el.innerHTML }catch(e){}
  }
  function reapplySticky(){
    Object.keys(stickyEdits).forEach(function(sel){
      var el; try{ el = document.querySelector(sel) }catch(e){ el = null }
      if (el && !inRoot(el) && el.innerHTML !== stickyEdits[sel]) el.innerHTML = stickyEdits[sel];
    });
  }
  new MutationObserver(function(){
    clearTimeout(stickyTimer);
    stickyTimer = setTimeout(reapplySticky, 30);
  }).observe(document.body, { childList: true, subtree: true, characterData: true });

  function setMode(v){
    if (v && window.__annoExitForEdit) window.__annoExitForEdit();
    emode = v;
    editBtn.classList.toggle('on', v);
    editBtn.textContent = v ? '✕ 退出编辑' : '✎ 编辑模式';
    if (v) openPalette();
    else { deselect(); closePalette() }
  }
  editBtn.onclick = function(){ setMode(!emode) };
  window.__editExitForAnno = function(){ if (emode) setMode(false) };

  /* ---------- 悬停高亮 ---------- */
  var hoverEl = null;
  document.addEventListener('mouseover', function(e){
    if (!emode || inRoot(e.target)) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    if (hoverEl) hoverEl.classList.remove('edit-hover');
    hoverEl = e.target; hoverEl.classList.add('edit-hover');
  }, true);
  document.addEventListener('mouseout', function(e){
    if (hoverEl === e.target) { hoverEl.classList.remove('edit-hover'); hoverEl = null }
  }, true);

  /* ---------- 选中 / 拖动已定位元素 ---------- */
  var downInfo = null;
  function placeCaretAt(x, y){
    var range = null;
    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if (document.caretPositionFromPoint) {
      var pos = document.caretPositionFromPoint(x, y);
      if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset) }
    }
    if (!range) return;
    var sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  document.addEventListener('mousedown', function(e){
    if (!emode || inRoot(e.target) || e.button !== 0) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') {
      if (esel === e.target || esel.contains(e.target)) placeCaretAt(e.clientX, e.clientY);
      return;                                          /* 正在编辑文字时放行原生行为 */
    }
    if (esel && e.target === esel) { startElementDrag(e); return }
    downInfo = { x: e.clientX, y: e.clientY, t: e.target };
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('mouseup', function(e){
    if (!downInfo) return;
    var d = downInfo; downInfo = null;
    if (Math.abs(e.clientX - d.x) < 4 && Math.abs(e.clientY - d.y) < 4) select(d.t);
  }, true);
  document.addEventListener('click', function(e){
    if (emode && !inRoot(e.target) && !(esel && esel.getAttribute('contenteditable') === 'true')) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  document.addEventListener('dblclick', function(e){
    if (!emode || inRoot(e.target)) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    e.preventDefault(); e.stopPropagation();
    if (esel !== e.target) select(e.target);
    if (esel) { startTextEdit(); placeCaretAt(e.clientX, e.clientY) }
  }, true);

  function select(el){
    if (!el || el === document.documentElement || el === document.body) { deselect(); return }
    esel = el; drawBox(); showToolbar(); closePanel(); closeTextPanel();
  }
  function deselect(){
    esel = null;
    if (box) { box.remove(); box = null }
    if (tbar) { tbar.remove(); tbar = null }
    closePanel();
    closeTextPanel();
    hideFormatBar();
  }

  function drawBox(){
    if (!esel) return;
    if (!box) { box = document.createElement('div'); box.className = 'edit-box'; root.appendChild(box) }
    var r = esel.getBoundingClientRect();
    box.style.left = r.left + 'px'; box.style.top = r.top + 'px';
    box.style.width = r.width + 'px'; box.style.height = r.height + 'px';
    var rz = box.querySelector('.edit-rz');
    if (!rz) { rz = document.createElement('div'); rz.className = 'edit-rz'; box.appendChild(rz); rz.addEventListener('mousedown', startResize) }
    rz.style.display = 'block';
  }

  function showToolbar(){
    if (!tbar) { tbar = document.createElement('div'); tbar.className = 'edit-tbar pe'; root.appendChild(tbar) }
    var isImg = esel.classList.contains('edit-imgph');
    var isSelect = esel.tagName === 'SELECT';
    var isTable = esel.tagName === 'TABLE';
    tbar.innerHTML =
      '<button data-a="style" title="样式">🎨</button>' +
      '<button data-a="text" title="编辑文字">✏️</button>' +
      (isImg ? '<button data-a="img" title="上传图片">🖼</button>' : '') +
      (isSelect ? '<button data-a="opts" title="编辑选项">📝</button>' : '') +
      (isTable ? '<button data-a="colup" title="增加列">➕列</button><button data-a="coldown" title="减少列">➖列</button>' : '') +
      '<button data-a="up" title="上移">↑</button>' +
      '<button data-a="down" title="下移">↓</button>' +
      '<button data-a="dup" title="复制">⧉</button>' +
      '<button data-a="del" title="删除">🗑</button>';
    tbar.onclick = function(e){ var b = e.target.closest('button'); if (b) { e.stopPropagation(); act(b.dataset.a) } };
    tbar.onmousedown = function(e){ e.stopPropagation() };
    posToolbar();
  }
  function posToolbar(){
    if (!tbar || !esel) return;
    var r = esel.getBoundingClientRect();
    var top = r.top - 38; if (top < 4) top = r.bottom + 6;
    tbar.style.left = Math.max(4, Math.min(r.left, innerWidth - tbar.offsetWidth - 4)) + 'px';
    tbar.style.top = top + 'px';
  }

  function act(k){
    if (!esel) return;
    if (['colup', 'coldown', 'up', 'down', 'dup', 'del'].indexOf(k) >= 0) pushUndo();
    if (k === 'style') { togglePanel(); return }
    if (k === 'text') { openTextPanel(); return }
    if (k === 'img') { imgFileInput.click(); return }
    if (k === 'opts') { openOptsEditor(); return }
    if (k === 'colup') {
      Array.prototype.forEach.call(esel.rows, function(row){
        var ref = row.cells[row.cells.length - 1];
        var cell = document.createElement(ref ? ref.tagName : 'TD');
        cell.setAttribute('style', ref ? (ref.getAttribute('style') || '') : 'border:1px solid #d0d5dd;padding:8px 12px');
        cell.textContent = ref ? ref.textContent : '内容';
        row.appendChild(cell);
      });
      drawBox(); return;
    }
    if (k === 'coldown') {
      if (esel.rows[0] && esel.rows[0].cells.length > 1) {
        Array.prototype.forEach.call(esel.rows, function(row){
          if (row.lastElementChild) row.lastElementChild.remove();
        });
      }
      drawBox(); return;
    }
    if (k === 'up') {
      var p = esel.previousElementSibling;
      if (p && !inRoot(p)) esel.parentNode.insertBefore(esel, p);
      drawBox(); posToolbar(); return;
    }
    if (k === 'down') {
      var n = esel.nextElementSibling;
      if (n && !inRoot(n)) esel.parentNode.insertBefore(n, esel);
      drawBox(); posToolbar(); return;
    }
    if (k === 'dup') { var c = esel.cloneNode(true); esel.parentNode.insertBefore(c, esel.nextSibling); select(c); return }
    if (k === 'del') { if (confirm('删除该元素？')) { var t = esel; deselect(); t.remove() } return }
  }

  function startTextEdit(){
    if (!esel) return;
    pushUndo();
    var editingEl = esel;
    editingEl.setAttribute('contenteditable', 'true');
    editingEl.classList.add('edit-editing');
    editingEl.dataset.editPrevUserSelect = editingEl.style.userSelect || '';
    editingEl.style.userSelect = 'text';
    editingEl.style.webkitUserSelect = 'text';
    editingEl.focus();
    var range = document.createRange();
    range.selectNodeContents(editingEl);
    range.collapse(false);
    var sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    function onInput(){ protectEdit(editingEl) }
    editingEl.addEventListener('input', onInput);
    function done(){
      setTimeout(function(){
        var active = document.activeElement;
        if ((fbar && fbar.contains(active)) || (cpop && cpop.contains(active))) return;
        protectEdit(editingEl);
        editingEl.removeEventListener('input', onInput);
        editingEl.setAttribute('contenteditable', 'false');
        editingEl.classList.remove('edit-editing');
        editingEl.style.userSelect = editingEl.dataset.editPrevUserSelect;
        delete editingEl.dataset.editPrevUserSelect;
        editingEl.removeEventListener('blur', done);
        editingEl.removeEventListener('keydown', onKey);
        hideFormatBar();
      }, 0);
    }
    function onKey(e){ if (e.key === 'Escape') { e.preventDefault(); done() } }
    editingEl.addEventListener('blur', done);
    editingEl.addEventListener('keydown', onKey);
  }

  /* ---------- 选中文字后的格式工具条(加粗/斜体/下划线/字号/文字色) ---------- */
  var fbar = null, savedTextRange = null;
  function restoreTextSelection(){
    if (!savedTextRange || !esel) return;
    esel.focus();
    var sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(savedTextRange);
  }
  function refreshSavedRange(){
    var sel = getSelection();
    if (esel && sel.rangeCount && !sel.isCollapsed && esel.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      savedTextRange = sel.getRangeAt(0).cloneRange();
    }
  }
  function toggleTextItalic(){                  /* 手动切换斜体，避免部分浏览器 execCommand('italic') 失效 */
    restoreTextSelection();
    var s = getSelection(); if (!s || !s.rangeCount || !esel) return;
    var r = s.getRangeAt(0);
    if (r.collapsed || !esel.contains(r.commonAncestorContainer)) return;
    var probe = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
    var on = probe && esel.contains(probe) && getComputedStyle(probe).fontStyle === 'italic';
    var frag = r.extractContents();
    var span = document.createElement('span'); span.style.fontStyle = on ? 'normal' : 'italic';
    span.appendChild(frag); r.insertNode(span);
    var r2 = document.createRange(); r2.selectNodeContents(span);
    s.removeAllRanges(); s.addRange(r2);
    refreshSavedRange();
    protectEdit(esel);
  }
  function applyFontSize(px){
    restoreTextSelection();
    document.execCommand('fontSize', false, '7');
    var fonts = esel.querySelectorAll('font[size="7"]');
    Array.prototype.forEach.call(fonts, function(f){ f.removeAttribute('size'); f.style.fontSize = px + 'px' });
    refreshSavedRange();
    protectEdit(esel);
  }
  function showFormatBar(range){
    savedTextRange = range.cloneRange();
    if (tbar) tbar.style.display = 'none';
    if (!fbar) {
      fbar = document.createElement('div'); fbar.className = 'edit-fbar pe';
      fbar.innerHTML =
        '<button data-c="bold" title="加粗"><b>B</b></button>' +
        '<button data-c="italic" title="斜体"><i>I</i></button>' +
        '<button data-c="underline" title="下划线"><u>U</u></button>' +
        '<input class="fsize" type="number" min="8" max="96" title="字号(px)" placeholder="字号">' +
        '<button type="button" class="fcolor" title="文字颜色"></button>';
      root.appendChild(fbar);
      fbar.addEventListener('mousedown', function(e){
        if (e.target.tagName !== 'INPUT') e.preventDefault();
        e.stopPropagation();
      });
      fbar.addEventListener('click', function(e){
        var b = e.target.closest('button[data-c]');
        if (!b) return;
        e.stopPropagation();
        if (b.dataset.c === 'italic') { toggleTextItalic(); return }
        restoreTextSelection(); document.execCommand(b.dataset.c, false, null); refreshSavedRange(); protectEdit(esel);
      });
      fbar.querySelector('.fsize').addEventListener('change', function(e){
        var v = parseInt(e.target.value, 10);
        if (v) applyFontSize(v);
      });
      fbar.querySelector('.fcolor').addEventListener('click', function(e){
        e.stopPropagation();
        openColorPopup(fbar.querySelector('.fcolor'), function(v){ restoreTextSelection(); document.execCommand('foreColor', false, v); refreshSavedRange(); protectEdit(esel) });
      });
    }
    var r = range.getBoundingClientRect();
    if (!r.width && !r.height) return;
    fbar.style.display = 'flex';
    fbar.style.left = Math.max(4, Math.min(r.left, innerWidth - 300)) + 'px';
    fbar.style.top = Math.max(4, r.top - 40) + 'px';
  }
  function hideFormatBar(){
    if (fbar) fbar.style.display = 'none';
    if (tbar && esel) tbar.style.display = 'flex';
  }
  document.addEventListener('selectionchange', function(){
    if (!esel || esel.getAttribute('contenteditable') !== 'true') { hideFormatBar(); return }
    var sel = getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) { hideFormatBar(); return }
    var range = sel.getRangeAt(0);
    if (!esel.contains(range.commonAncestorContainer)) { hideFormatBar(); return }
    showFormatBar(range);
  });

  /* ---------- 自由拖动(任意元素;非定位元素首次拖动时自动转为 absolute,不影响单击) ---------- */
  function startElementDrag(e){
    e.preventDefault(); e.stopPropagation();
    var el = esel;
    var sx = e.clientX, sy = e.clientY, moved = false, startLeft = 0, startTop = 0;
    function ensureFree(){
      var cs = getComputedStyle(el);
      var elR = el.getBoundingClientRect();
      if (cs.position === 'absolute' || cs.position === 'fixed') {
        startLeft = parseFloat(cs.left) || 0; startTop = parseFloat(cs.top) || 0;
        if (cs.position === 'fixed') {
          if (cs.left === 'auto') startLeft = elR.left;
          if (cs.top === 'auto') startTop = elR.top;
        } else {
          var op = el.offsetParent || document.body, opR = op.getBoundingClientRect();
          if (cs.left === 'auto') startLeft = elR.left - opR.left;
          if (cs.top === 'auto') startTop = elR.top - opR.top;
        }
      } else {
        var op2 = el.offsetParent || document.body, opR2 = op2.getBoundingClientRect();
        startLeft = elR.left - opR2.left;
        startTop = elR.top - opR2.top;
        el.style.position = 'absolute';
        el.style.margin = '0';
        el.style.left = startLeft + 'px';
        el.style.top = startTop + 'px';
      }
    }
    function mv(ev){
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        moved = true;
        pushUndo();
        ensureFree();
      }
      el.style.left = (startLeft + dx) + 'px';
      el.style.top = (startTop + dy) + 'px';
      drawBox(); posToolbar();
    }
    function up(){ document.removeEventListener('mousemove', mv, true); document.removeEventListener('mouseup', up, true) }
    document.addEventListener('mousemove', mv, true);
    document.addEventListener('mouseup', up, true);
  }
  function startResize(e){
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    var el = esel, sw = el.offsetWidth, sh = el.offsetHeight, sx = e.clientX, sy = e.clientY;
    function mv(ev){
      el.style.width = Math.max(20, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(20, sh + ev.clientY - sy) + 'px';
      drawBox(); posToolbar();
    }
    function up(){ document.removeEventListener('mousemove', mv, true); document.removeEventListener('mouseup', up, true) }
    document.addEventListener('mousemove', mv, true);
    document.addEventListener('mouseup', up, true);
  }

  /* ---------- 样式面板 ---------- */
  function togglePanel(){ if (panel) closePanel(); else openPanel() }
  function closePanel(){ if (panel) { panel.remove(); panel = null } closeColorPopup(); closeOptsEditor() }
  function rgbToHex(rgb){
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb || ''); if (!m) return '#ffffff';
    function h(n){ n = (+n).toString(16); return n.length < 2 ? '0' + n : n }
    return '#' + h(m[1]) + h(m[2]) + h(m[3]);
  }
  function fieldRow(label, name, type, val){
    return '<label class="fld"><span>' + label + '</span><input data-f="' + name + '" type="' + type + '" value="' +
      (val == null ? '' : String(val).replace(/"/g, '&quot;')) + '"></label>';
  }
  var COLOR_GRID = [
    ['#000000', '#333333', '#666666', '#999999', '#bbbbbb', '#dddddd', '#ffffff'],
    ['#f5a3a3', '#f5c9a3', '#f5f0a3', '#c9f5a3', '#a3f5e0', '#a3d4f5', '#c9a3f5'],
    ['#e03a3a', '#e0813a', '#e0d43a', '#7fe03a', '#3ae0c2', '#3a8fe0', '#8f3ae0'],
    ['#8f1f1f', '#8f4f1f', '#8f841f', '#4f8f1f', '#1f8f77', '#1f588f', '#571f8f']
  ];
  function rgbaAlpha(rgb){
    var m = /rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\s*\)/.exec(rgb || '');
    return m ? Math.round(parseFloat(m[1]) * 100) : 100;
  }
  function colorRow(label, name, val, alpha){
    var v = (val || '#000000').toLowerCase();
    return '<div class="fld col"><span>' + label + '</span><button type="button" class="swatch" data-f="' + name + '" data-hex="' + v + '" data-alpha="' + (alpha == null ? 100 : alpha) + '" style="background:' + v + '"></button></div>';
  }
  var cpop = null;
  function closeColorPopup(){ if (cpop) { cpop.remove(); cpop = null } }
  function openColorPopup(anchorBtn, setter){
    closeColorPopup();
    cpop = document.createElement('div'); cpop.className = 'edit-cpop pe';
    var rows = COLOR_GRID.map(function(row){
      return '<div class="row">' + row.map(function(c){ return '<i data-c="' + c + '" style="background:' + c + '"></i>' }).join('') + '</div>';
    }).join('');
    cpop.innerHTML = '<div class="hexrow"><input class="hex" type="text" maxlength="7" placeholder="#000000">' +
      (window.EyeDropper ? '<button type="button" class="eye" title="取色器">💧</button>' : '') + '</div>' +
      '<div class="alpharow"><span>透明度</span><input class="alpha" type="range" min="0" max="100"><span class="alphaval"></span></div>' +
      '<div class="grid">' + rows + '</div>';
    root.appendChild(cpop);
    var r = anchorBtn.getBoundingClientRect();
    cpop.style.left = Math.max(4, Math.min(r.left, innerWidth - 210)) + 'px';
    cpop.style.top = Math.max(4, Math.min(r.bottom + 6, innerHeight - 260)) + 'px';
    cpop.onmousedown = function(e){ if (e.target.tagName !== 'INPUT') e.preventDefault(); e.stopPropagation() };
    var hex = cpop.querySelector('.hex');
    var alphaInput = cpop.querySelector('.alpha');
    var alphaVal = cpop.querySelector('.alphaval');
    hex.value = anchorBtn.dataset.hex || '#000000';
    var curAlpha = anchorBtn.dataset.alpha != null ? +anchorBtn.dataset.alpha : 100;
    alphaInput.value = curAlpha;
    alphaVal.textContent = curAlpha + '%';
    function finalColor(){
      var v = hex.value, a = +alphaInput.value;
      if (a >= 100) return v;
      var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v);
      if (!m) return v;
      return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + (a / 100).toFixed(2) + ')';
    }
    function apply(){
      var out = finalColor();
      setter(out);

    while (n && n !== pageEnd) { var next = n.nextSibling; document.body.removeChild(n); n = next }
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    while (tmp.firstChild) document.body.insertBefore(tmp.firstChild, pageEnd);
  }
  if (!PAGES.hasOwnProperty(currentPageId)) {
    var initialPages = {};
    var initialAnnoStore = document.getElementById('anno-data');
    initialPages[currentPageId] = {
      html: getPageContentHTML(),
      anno: initialAnnoStore ? initialAnnoStore.textContent : '{"pref":{"g":"常用","c":"#ff7a45"},"list":[]}'
    };
    Object.keys(PAGES).forEach(function(id){ initialPages[id] = PAGES[id] });
    PAGES = initialPages;
    persistPages();
  }
  /* ---------- 撤销 / 还原(基于整页内容快照,最多各 5 步) ---------- */
  var MAX_UNDO = 5;
  var undoStack = [], redoStack = [];
  function updateUndoRedoButtons(){
    undoBtn.disabled = !undoStack.length;
    redoBtn.disabled = !redoStack.length;
  }
  function pushUndo(){
    undoStack.push(getPageContentHTML());
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }
  function doUndo(){
    if (!undoStack.length) return;
    var cur = getPageContentHTML();
    var prev = undoStack.pop();
    redoStack.push(cur);
    if (redoStack.length > MAX_UNDO) redoStack.shift();
    deselect();
    setPageContent(prev);
    updateUndoRedoButtons();
  }
  function doRedo(){
    if (!redoStack.length) return;
    var cur = getPageContentHTML();
    var next = redoStack.pop();
    undoStack.push(cur);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    deselect();
    setPageContent(next);
    updateUndoRedoButtons();
  }
  undoBtn.onclick = doUndo;
  redoBtn.onclick = doRedo;

  var BLANK_ANNO = '{"pref":{"g":"常用","c":"#ff7a45"},"list":[]}';
  function escapeHTML(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }
  function currentAnnoDataText(){
    if (window.__annoGetData) return window.__annoGetData();
    var s = document.getElementById('anno-data');
    return s ? s.textContent : BLANK_ANNO;
  }
  function migrateLegacyTrailingPageNodes(){
    var move = [], n = pageEnd.nextSibling;
    while (n) {
      var next = n.nextSibling;
      if (n.nodeType === 1 && n.id !== 'anno-root' && n.id !== PAGES_STORE_ID &&
          !/^(STYLE|SCRIPT|LINK|META)$/i.test(n.tagName)) move.push(n);
      n = next;
    }
    move.forEach(function(node){ insertPageNode(node) });
    if (move.length) {
      PAGES[currentPageId] = { html: getPageContentHTML(), anno: currentAnnoDataText() };
      persistPages();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', migrateLegacyTrailingPageNodes, { once:true });
  else setTimeout(migrateLegacyTrailingPageNodes, 0);


  /* ---------- 持续跟随滚动 / 缩放 ---------- */
  document.addEventListener('scroll', function(){ if (esel) { drawBox(); posToolbar(); positionPanel(); positionTextPanel() } }, true);
  addEventListener('resize', function(){ if (esel) { drawBox(); posToolbar(); positionPanel(); positionTextPanel() } });
  setInterval(function(){ if (esel) { drawBox(); posToolbar() } }, 500);

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape' || !emode) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    if (textPanel) { closeTextPanel(); return }
    if (panel) { closePanel(); return }
    if (esel) { deselect(); return }
    setMode(false);
  });
})();
</script>
