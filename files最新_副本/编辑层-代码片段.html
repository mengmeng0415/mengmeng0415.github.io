  .edit-fbar input.fsize{width:44px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:4px;padding:5px 4px;font-size:12px;text-align:center}

  .edit-textpanel{width:280px}
  .edit-textpanel .tb{display:flex;align-items:center;gap:2px;background:#1f2329;padding:6px 8px}
  .edit-textpanel .tb button{border:0;background:transparent;color:#fff;font-size:13px;padding:5px 9px;border-radius:4px;cursor:pointer}

  .edit-textpanel .tb input.fsize{width:44px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:4px;padding:5px 4px;font-size:12px;text-align:center}
  .edit-textpanel .tb .fcolor{width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.4);cursor:pointer;padding:0;background:#ff0000;flex:0 0 auto;margin-left:auto}

  .edit-pal{position:fixed;width:230px;background:#fff;border:1px solid #e5e8ee;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:99999;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .edit-pal .hd{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #eef0f4;font-weight:700;cursor:move;user-select:none}

<script>
(function(){
  if(window.__editLayerInit) return;
  window.__editLayerInit = true;

  var STORE = document.getElementById('anno-data');
  var RO = STORE ? STORE.getAttribute('data-mode') === 'readonly' : false;
  if (RO) { return }

  var root = document.getElementById('anno-root');
  if (!root) {
    root = document.createElement('div'); root.id = 'anno-root';
    root.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:99999;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#1f2329';
    document.body.appendChild(root);
  }

  var bar = document.querySelector('.anno-bar');
  var ownBar = false;
  if (!bar) {
    bar = document.createElement('div'); bar.className = 'edit-bar pe';
    root.appendChild(bar); ownBar = true;
  }

  var editBtn = document.createElement('button'); editBtn.id = 'editMode'; editBtn.textContent = '✎ 编辑模式';
  var undoBtn = document.createElement('button'); undoBtn.id = 'editUndo'; undoBtn.title = '撤销'; undoBtn.textContent = '↶ 撤销'; undoBtn.disabled = true;
  var redoBtn = document.createElement('button'); redoBtn.id = 'editRedo'; redoBtn.title = '还原'; redoBtn.textContent = '↷ 还原'; redoBtn.disabled = true;
  var bubbleAnchor = document.getElementById('annoMode');
  var listAnchor = document.getElementById('annoList');
  if (bubbleAnchor && bubbleAnchor.parentNode === bar) {
    bar.insertBefore(editBtn, bubbleAnchor.nextSibling);
    if (listAnchor && listAnchor.parentNode === bar) {
      bar.insertBefore(undoBtn, listAnchor); bar.insertBefore(redoBtn, listAnchor);
    } else { bar.appendChild(undoBtn); bar.appendChild(redoBtn) }
  } else {
    bar.appendChild(editBtn); bar.appendChild(undoBtn); bar.appendChild(redoBtn);
  }

  var emode = false, esel = null, box = null, tbar = null, panel = null, palPanel = null;
  var dragKey = null, dropHint = null;

  var imgFileInput = document.createElement('input');
  imgFileInput.type = 'file'; imgFileInput.accept = 'image/*'; imgFileInput.className = 'pe';
  imgFileInput.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
  root.appendChild(imgFileInput);
  imgFileInput.addEventListener('change', function(){
    var f = imgFileInput.files[0];
    if (!f || !esel) { imgFileInput.value = ''; return }
    pushUndo();
    var reader = new FileReader();
    reader.onload = function(){
      esel.style.backgroundImage = 'url(' + reader.result + ')';
      esel.textContent = '';
      imgFileInput.value = '';
    };
    reader.readAsDataURL(f);
  });

  function inRoot(el){ return !!el && root.contains(el) }
  function isFreePos(el){ var p = getComputedStyle(el).position; return p === 'absolute' || p === 'fixed' }

  function pathOf(el){
    if (!el || el === document.body) return 'body';
    var p = [];
    while (el && el !== document.body && el.nodeType === 1) {
      var i = 1, s = el; while (s = s.previousElementSibling) { if (s.tagName === el.tagName) i++ }
      p.unshift(el.tagName.toLowerCase() + ':nth-of-type(' + i + ')'); el = el.parentElement;
    }
    return 'body>' + p.join('>');
  }

  /* ---------- 编辑内容防丢失：React/Vue 等框架重渲染会覆盖手动改的DOM，这里记住每处编辑，
     一旦发现被外部改回去就自动补写回来，不需要用户编辑完立刻下载 ---------- */
  var stickyEdits = {}, stickyTimer = null;
  function protectEdit(el){
    if (!el) return;
    try{ stickyEdits[pathOf(el)] = el.innerHTML }catch(e){}
  }
  function reapplySticky(){
    Object.keys(stickyEdits).forEach(function(sel){
      var el; try{ el = document.querySelector(sel) }catch(e){ el = null }
      if (el && !inRoot(el) && el.innerHTML !== stickyEdits[sel]) el.innerHTML = stickyEdits[sel];
    });
  }
  new MutationObserver(function(){
    clearTimeout(stickyTimer);
    stickyTimer = setTimeout(reapplySticky, 30);
  }).observe(document.body, { childList: true, subtree: true, characterData: true });

  function setMode(v){
    if (v && window.__annoExitForEdit) window.__annoExitForEdit();
    emode = v;
    editBtn.classList.toggle('on', v);
    editBtn.textContent = v ? '✕ 退出编辑' : '✎ 编辑模式';
    if (v) openPalette();
    else { deselect(); closePalette() }
  }
  editBtn.onclick = function(){ setMode(!emode) };
  window.__editExitForAnno = function(){ if (emode) setMode(false) };

  /* ---------- 悬停高亮 ---------- */
  var hoverEl = null;
  document.addEventListener('mouseover', function(e){
    if (!emode || inRoot(e.target)) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    if (hoverEl) hoverEl.classList.remove('edit-hover');
    hoverEl = e.target; hoverEl.classList.add('edit-hover');
  }, true);
  document.addEventListener('mouseout', function(e){
    if (hoverEl === e.target) { hoverEl.classList.remove('edit-hover'); hoverEl = null }
  }, true);

  /* ---------- 选中 / 拖动已定位元素 ---------- */
  var downInfo = null;
  function placeCaretAt(x, y){
    var range = null;
    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if (document.caretPositionFromPoint) {
      var pos = document.caretPositionFromPoint(x, y);
      if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset) }
    }
    if (!range) return;
    var sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  document.addEventListener('mousedown', function(e){
    if (!emode || inRoot(e.target) || e.button !== 0) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') {
      if (esel === e.target || esel.contains(e.target)) placeCaretAt(e.clientX, e.clientY);
      return;                                          /* 正在编辑文字时放行原生行为 */
    }
    if (esel && e.target === esel) { startElementDrag(e); return }
    downInfo = { x: e.clientX, y: e.clientY, t: e.target };
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('mouseup', function(e){
    if (!downInfo) return;
    var d = downInfo; downInfo = null;
    if (Math.abs(e.clientX - d.x) < 4 && Math.abs(e.clientY - d.y) < 4) select(d.t);
  }, true);
  document.addEventListener('click', function(e){
    if (emode && !inRoot(e.target) && !(esel && esel.getAttribute('contenteditable') === 'true')) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  document.addEventListener('dblclick', function(e){
    if (!emode || inRoot(e.target)) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    e.preventDefault(); e.stopPropagation();
    if (esel !== e.target) select(e.target);
    if (esel) { startTextEdit(); placeCaretAt(e.clientX, e.clientY) }
  }, true);

  function select(el){
    if (!el || el === document.documentElement || el === document.body) { deselect(); return }
    esel = el; drawBox(); showToolbar(); closePanel(); closeTextPanel();
  }
  function deselect(){
    esel = null;
    if (box) { box.remove(); box = null }
    if (tbar) { tbar.remove(); tbar = null }
    closePanel();
    closeTextPanel();
    hideFormatBar();
  }

  function drawBox(){
    if (!esel) return;
    if (!box) { box = document.createElement('div'); box.className = 'edit-box'; root.appendChild(box) }
    var r = esel.getBoundingClientRect();
    box.style.left = r.left + 'px'; box.style.top = r.top + 'px';
    box.style.width = r.width + 'px'; box.style.height = r.height + 'px';
    var rz = box.querySelector('.edit-rz');

  function act(k){
    if (!esel) return;
    if (['colup', 'coldown', 'up', 'down', 'dup', 'del'].indexOf(k) >= 0) pushUndo();
    if (k === 'style') { togglePanel(); return }
    if (k === 'text') { openTextPanel(); return }
    if (k === 'img') { imgFileInput.click(); return }
    if (k === 'opts') { openOptsEditor(); return }
    if (k === 'colup') {
      Array.prototype.forEach.call(esel.rows, function(row){
        var ref = row.cells[row.cells.length - 1];
        var cell = document.createElement(ref ? ref.tagName : 'TD');
        cell.setAttribute('style', ref ? (ref.getAttribute('style') || '') : 'border:1px solid #d0d5dd;padding:8px 12px');
        cell.textContent = ref ? ref.textContent : '内容';
        row.appendChild(cell);
      });
      drawBox(); return;
    }
    if (k === 'coldown') {
      if (esel.rows[0] && esel.rows[0].cells.length > 1) {
        Array.prototype.forEach.call(esel.rows, function(row){
          if (row.lastElementChild) row.lastElementChild.remove();
        });
      }
      drawBox(); return;
    }
    if (k === 'up') {
      var p = esel.previousElementSibling;
      if (p && !inRoot(p)) esel.parentNode.insertBefore(esel, p);
      drawBox(); posToolbar(); return;
    }
    if (k === 'down') {
      var n = esel.nextElementSibling;
      if (n && !inRoot(n)) esel.parentNode.insertBefore(n, esel);
      drawBox(); posToolbar(); return;
    }
    if (k === 'dup') { var c = esel.cloneNode(true); esel.parentNode.insertBefore(c, esel.nextSibling); select(c); return }
    if (k === 'del') { if (confirm('删除该元素？')) { var t = esel; deselect(); t.remove() } return }
  }

  function startTextEdit(){
    if (!esel) return;
    pushUndo();
    var editingEl = esel;
    editingEl.setAttribute('contenteditable', 'true');
    editingEl.classList.add('edit-editing');
    editingEl.dataset.editPrevUserSelect = editingEl.style.userSelect || '';
    editingEl.style.userSelect = 'text';
    editingEl.style.webkitUserSelect = 'text';
    editingEl.focus();
    var range = document.createRange();
    range.selectNodeContents(editingEl);
    range.collapse(false);
    var sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    function onInput(){ protectEdit(editingEl) }
    editingEl.addEventListener('input', onInput);
    function done(){
      setTimeout(function(){
        var active = document.activeElement;
        if ((fbar && fbar.contains(active)) || (cpop && cpop.contains(active))) return;
        protectEdit(editingEl);
        editingEl.removeEventListener('input', onInput);

        editingEl.classList.remove('edit-editing');
        editingEl.style.userSelect = editingEl.dataset.editPrevUserSelect;

        editingEl.removeEventListener('keydown', onKey);

  /* ---------- 选中文字后的格式工具条(加粗/斜体/下划线/字号/文字色) ---------- */
  var fbar = null, savedTextRange = null;

  function refreshSavedRange(){

  function toggleTextItalic(){                  /* 手动切换斜体，避免部分浏览器 execCommand('italic') 失效 */

    var r = s.getRangeAt(0);
    if (r.collapsed || !esel.contains(r.commonAncestorContainer)) return;
    var probe = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
    var on = probe && esel.contains(probe) && getComputedStyle(probe).fontStyle === 'italic';
    var frag = r.extractContents();
    var span = document.createElement('span'); span.style.fontStyle = on ? 'normal' : 'italic';
    span.appendChild(frag); r.insertNode(span);

  /* ---------- 自由拖动(任意元素;非定位元素首次拖动时自动转为 absolute,不影响单击) ---------- */
  function startElementDrag(e){
    e.preventDefault(); e.stopPropagation();
    var el = esel;
    var sx = e.clientX, sy = e.clientY, moved = false, startLeft = 0, startTop = 0;
    function ensureFree(){
      var cs = getComputedStyle(el);
      var elR = el.getBoundingClientRect();
      if (cs.position === 'absolute' || cs.position === 'fixed') {
        startLeft = parseFloat(cs.left) || 0; startTop = parseFloat(cs.top) || 0;
        if (cs.position === 'fixed') {
          if (cs.left === 'auto') startLeft = elR.left;
          if (cs.top === 'auto') startTop = elR.top;
        } else {
          var op = el.offsetParent || document.body, opR = op.getBoundingClientRect();
          if (cs.left === 'auto') startLeft = elR.left - opR.left;
          if (cs.top === 'auto') startTop = elR.top - opR.top;
        }
      } else {
        var op2 = el.offsetParent || document.body, opR2 = op2.getBoundingClientRect();
        startLeft = elR.left - opR2.left;
        startTop = elR.top - opR2.top;
        el.style.position = 'absolute';
        el.style.margin = '0';
        el.style.left = startLeft + 'px';
        el.style.top = startTop + 'px';
      }
    }
    function mv(ev){
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        moved = true;
        pushUndo();
        ensureFree();
      }
      el.style.left = (startLeft + dx) + 'px';
      el.style.top = (startTop + dy) + 'px';
      drawBox(); posToolbar();
    }
    function up(){ document.removeEventListener('mousemove', mv, true); document.removeEventListener('mouseup', up, true) }
    document.addEventListener('mousemove', mv, true);
    document.addEventListener('mouseup', up, true);
  }
  function startResize(e){
    e.preventDefault(); e.stopPropagation();
    pushUndo();
    var el = esel, sw = el.offsetWidth, sh = el.offsetHeight, sx = e.clientX, sy = e.clientY;
    function mv(ev){
      el.style.width = Math.max(20, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(20, sh + ev.clientY - sy) + 'px';
      drawBox(); posToolbar();
    }
    function up(){ document.removeEventListener('mousemove', mv, true); document.removeEventListener('mouseup', up, true) }
    document.addEventListener('mousemove', mv, true);
    document.addEventListener('mouseup', up, true);
  }

  /* ---------- 样式面板 ---------- */
  function togglePanel(){ if (panel) closePanel(); else openPanel() }
  function closePanel(){ if (panel) { panel.remove(); panel = null } closeColorPopup(); closeOptsEditor() }
  function rgbToHex(rgb){
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb || ''); if (!m) return '#ffffff';
    function h(n){ n = (+n).toString(16); return n.length < 2 ? '0' + n : n }
    return '#' + h(m[1]) + h(m[2]) + h(m[3]);
  }
  function fieldRow(label, name, type, val){
    return '<label class="fld"><span>' + label + '</span><input data-f="' + name + '" type="' + type + '" value="' +
      (val == null ? '' : String(val).replace(/"/g, '&quot;')) + '"></label>';
  }
  var COLOR_GRID = [
    ['#000000', '#333333', '#666666', '#999999', '#bbbbbb', '#dddddd', '#ffffff'],
    ['#f5a3a3', '#f5c9a3', '#f5f0a3', '#c9f5a3', '#a3f5e0', '#a3d4f5', '#c9a3f5'],
    ['#e03a3a', '#e0813a', '#e0d43a', '#7fe03a', '#3ae0c2', '#3a8fe0', '#8f3ae0'],
    ['#8f1f1f', '#8f4f1f', '#8f841f', '#4f8f1f', '#1f8f77', '#1f588f', '#571f8f']
  ];
  function rgbaAlpha(rgb){
    var m = /rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\s*\)/.exec(rgb || '');
    return m ? Math.round(parseFloat(m[1]) * 100) : 100;
  }
  function colorRow(label, name, val, alpha){
    var v = (val || '#000000').toLowerCase();
    return '<div class="fld col"><span>' + label + '</span><button type="button" class="swatch" data-f="' + name + '" data-hex="' + v + '" data-alpha="' + (alpha == null ? 100 : alpha) + '" style="background:' + v + '"></button></div>';
  }
  var cpop = null;
  function closeColorPopup(){ if (cpop) { cpop.remove(); cpop = null } }
  function openColorPopup(anchorBtn, setter){
    closeColorPopup();
    cpop = document.createElement('div'); cpop.className = 'edit-cpop pe';
    var rows = COLOR_GRID.map(function(row){
      return '<div class="row">' + row.map(function(c){ return '<i data-c="' + c + '" style="background:' + c + '"></i>' }).join('') + '</div>';
    }).join('');
    cpop.innerHTML = '<div class="hexrow"><input class="hex" type="text" maxlength="7" placeholder="#000000">' +
      (window.EyeDropper ? '<button type="button" class="eye" title="取色器">💧</button>' : '') + '</div>' +
      '<div class="alpharow"><span>透明度</span><input class="alpha" type="range" min="0" max="100"><span class="alphaval"></span></div>' +
      '<div class="grid">' + rows + '</div>';
    root.appendChild(cpop);
    var r = anchorBtn.getBoundingClientRect();
    cpop.style.left = Math.max(4, Math.min(r.left, innerWidth - 210)) + 'px';
    cpop.style.top = Math.max(4, Math.min(r.bottom + 6, innerHeight - 260)) + 'px';
    cpop.onmousedown = function(e){ if (e.target.tagName !== 'INPUT') e.preventDefault(); e.stopPropagation() };
    var hex = cpop.querySelector('.hex');
    var alphaInput = cpop.querySelector('.alpha');
    var alphaVal = cpop.querySelector('.alphaval');
    hex.value = anchorBtn.dataset.hex || '#000000';
    var curAlpha = anchorBtn.dataset.alpha != null ? +anchorBtn.dataset.alpha : 100;
    alphaInput.value = curAlpha;
    alphaVal.textContent = curAlpha + '%';
    function finalColor(){
      var v = hex.value, a = +alphaInput.value;
      if (a >= 100) return v;
      var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v);
      if (!m) return v;
      return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + (a / 100).toFixed(2) + ')';
    }
    function apply(){
      var out = finalColor();
      setter(out);
      anchorBtn.style.background = out;
      anchorBtn.dataset.hex = hex.value;
      anchorBtn.dataset.alpha = alphaInput.value;
      drawBox();
    }
    Array.prototype.forEach.call(cpop.querySelectorAll('.row i'), function(sw){
      sw.onclick = function(){ hex.value = sw.dataset.c; apply() };
    });
    hex.addEventListener('change', function(){
      var v = hex.value.trim();
      if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
      hex.value = v;
      apply();
    });
    hex.addEventListener('keydown', function(e){ if (e.key === 'Enter') hex.blur() });
    alphaInput.addEventListener('input', function(){ alphaVal.textContent = alphaInput.value + '%'; apply() });
    var eye = cpop.querySelector('.eye');
    if (eye) eye.onclick = function(){
      new window.EyeDropper().open().then(function(res){ hex.value = res.sRGBHex; apply() }).catch(function(){});
    };
  }

    if (cpop && !cpop.contains(e.target)) closeColorPopup();
  }, true);

  function openTextPanel(){
    if (!esel) return;
    pushUndo();

    var target = esel;

    textPanel.innerHTML =

    function sync(){ target.innerHTML = ed.innerHTML; drawBox(); protectEdit(target) }
    ed.addEventListener('input', sync);
    var savedRange = null;
    function remember(){
      var s = getSelection(); if (!s || !s.rangeCount) return;

    function toggleItalicHere(){
      restore();
      var s = getSelection(); if (!s || !s.rangeCount) return;
      var r = s.getRangeAt(0);
      if (r.collapsed || !ed.contains(r.commonAncestorContainer)) return;
      var probe = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
      var on = probe && ed.contains(probe) && getComputedStyle(probe).fontStyle === 'italic';
      var frag = r.extractContents();
      var span = document.createElement('span'); span.style.fontStyle = on ? 'normal' : 'italic';
      span.appendChild(frag); r.insertNode(span);
      var r2 = document.createRange(); r2.selectNodeContents(span);
      s.removeAllRanges(); s.addRange(r2);
      remember(); sync();
    }
    Array.prototype.forEach.call(textPanel.querySelectorAll('.tb button[data-c]'), function(b){
      b.onmousedown = function(e){ e.preventDefault() };
      b.onclick = function(){
        if (b.dataset.c === 'italic') { toggleItalicHere(); return }
        restore(); document.execCommand(b.dataset.c, false, null); remember(); sync();
      };
    });
    textPanel.querySelector('.fsize').addEventListener('change', function(e){
      var v = parseInt(e.target.value, 10); if (!v) return;
      restore();
      document.execCommand('fontSize', false, '7');
      var fonts = ed.querySelectorAll('font[size="7"]');
      Array.prototype.forEach.call(fonts, function(f){ f.removeAttribute('size'); f.style.fontSize = v + 'px' });
      remember(); sync();
    });
    textPanel.querySelector('.fcolor').addEventListener('click', function(e){
      e.stopPropagation();
      openColorPopup(textPanel.querySelector('.fcolor'), function(v){ restore(); document.execCommand('foreColor', false, v); remember(); sync() });
    });
    ed.focus();
    var range = document.createRange(); range.selectNodeContents(ed);
    var sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    remember();
  }

  /* ---------- 组件面板(拖入新组件) ---------- */
  function calMonth(monthLabel, startOffset, selIdx, rangeFrom, rangeTo, todayIdx){
    var wd = ['日', '一', '二', '三', '四', '五', '六'].map(function(w){ return '<div class="wd">' + w + '</div>' }).join('');
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var n = i - startOffset + 1;
      var other = n < 1 || n > 31;
      var disp = n < 1 ? (n + 31) : (n > 31 ? (n - 31) : n);
      var cls = 'd' + (other ? ' other' : '') + (i >= rangeFrom && i <= rangeTo ? ' range' : '') + (i === selIdx ? ' sel' : '') + (i === todayIdx ? ' today' : '');
      cells += '<div class="' + cls + '">' + disp + '</div>';
    }
    return '<div class="month"><div class="mh"><span class="nav">«</span><span class="nav">‹</span><span>' + monthLabel + '</span><span class="nav">›</span><span class="nav">»</span></div><div class="grid">' + wd + cells + '</div></div>';
  }
  var CAL_HTML = '<div class="edit-cal">' +
    '<div class="side"><div>今日</div><div>昨天</div><div>最近7天</div><div>最近30天</div><div>上月</div><div>本月</div><div>最近三个月</div></div>' +
    '<div class="months">' + calMonth('2026年7月', 3, -1, -1, -1, 32) + calMonth('2026年8月', 6, 19, 8, 20, -1) + '</div>' +
    '</div>';
  var DATEPICKER_HTML =
    '<div class="edit-dtctl" style="display:inline-flex;align-items:center;border:1px solid #d0d5dd;border-radius:8px;overflow:hidden;font-size:14px;color:#1f2329;background:#fff;width:280px">' +
    '<select style="padding:8px 12px;color:#4b5563;white-space:nowrap;border:0;border-right:1px solid #eef0f4;background:#fff;flex:0 0 auto;font:inherit;cursor:pointer"><option>创建时间</option></select>' +
    '<div class="dt-trigger" style="flex:1;min-width:0;padding:8px 12px;color:#9aa0a8;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px">请选择日期<span style="color:#9aa0a8">📅</span></div>' +
    '</div>';

  var CATEGORIES = [
    { name: '基础', items: {
      btn: { label: '按钮', html: '<button style="padding:8px 16px;border-radius:6px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;font-size:14px">按钮</button>' },
      text: { label: '文字', html: '<p style="margin:0;font-size:14px;color:#1f2329;line-height:1.6">文本内容</p>' },
      img: { label: '图片', html: '<div class="edit-imgph" style="width:120px;height:80px;background:#e5e8ee;background-size:cover;background-position:center;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9aa0a8;font-size:12px">图片</div>' },
      box: { label: '容器', html: '<div style="width:200px;padding:16px;border:1px dashed #c6ccd6;border-radius:8px;min-height:60px;background:#fff">容器</div>' },
      hr: { label: '分隔线', html: '<hr style="width:160px;border:none;border-top:1px solid #c6ccd6;margin:0">' }
    }},
    { name: '图形', items: {
      rect: { label: '矩形', html: '<div style="width:120px;height:80px;background:#8a9099;border-radius:4px"></div>' },
      circle: { label: '圆形', html: '<div style="width:100px;height:100px;background:#8a9099;border-radius:50%"></div>' },
      triangle: { label: '三角形', html: '<div style="width:100px;height:86px;background:#8a9099;clip-path:polygon(50% 0%,0% 100%,100% 100%)"></div>' },
      line: { label: '直线', html: '<div style="width:120px;height:2px;background:#8a9099"></div>' }
    }},
    { name: '表单', items: {
      select: { label: '下拉菜单', html: '<select class="edit-select" style="padding:6px 10px;border:1px solid #d0d5dd;border-radius:6px;font-size:14px;background:#fff"><option>选项一</option><option>选项二</option><option>选项三</option></select>' },
      input: { label: '单行输入框', html: '<input type="text" placeholder="请输入" style="padding:6px 10px;border:1px solid #d0d5dd;border-radius:6px;font-size:14px;width:160px;box-sizing:border-box">' },
      textarea: { label: '多行输入框', html: '<textarea placeholder="请输入" style="padding:6px 10px;border:1px solid #d0d5dd;border-radius:6px;font-size:14px;width:200px;height:80px;resize:none;box-sizing:border-box;font-family:inherit"></textarea>' },
      datepicker: { label: '时间选择器', html: DATEPICKER_HTML },
      radio: { label: '单选', html: '<label style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap"><input type="radio" name="edit-radio-demo">选项文字</label>' },
      checkbox: { label: '复选', html: '<label style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap"><input type="checkbox">选项文字</label>' },
      table: { label: '表格', html: '<table class="edit-table" style="border-collapse:collapse;width:300px;font-size:13px"><tbody>' +
        '<tr><td style="border:1px solid #d0d5dd;padding:8px 12px;background:#fafbfc">标题1</td><td style="border:1px solid #d0d5dd;padding:8px 12px;background:#fafbfc">标题2</td><td style="border:1px solid #d0d5dd;padding:8px 12px;background:#fafbfc">标题3</td></tr>' +
        '<tr><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td></tr>' +
        '<tr><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td><td style="border:1px solid #d0d5dd;padding:8px 12px">内容</td></tr>' +
        '</tbody></table>' }
    }}
  ];
  var TEMPLATES = {}, TLABELS = {};
  CATEGORIES.forEach(function(cat){
    Object.keys(cat.items).forEach(function(k){
      TEMPLATES[k] = cat.items[k].html;
      TLABELS[k] = cat.items[k].label;
    });
  });

  var palCollapsed=false, palPos={l:document.documentElement.classList.contains('edit-pages-open')?248:16,t:60};
  function closePalette(){ if (palPanel) { palPanel.remove(); palPanel = null } }
  function openPalette(){
    if (palPanel) return;
    closePalette();
    palPanel = document.createElement('div'); palPanel.className = 'edit-pal pe';
    var body = CATEGORIES.map(function(cat){
      var items = Object.keys(cat.items).map(function(k){
        return '<div class="item" draggable="true" data-k="' + k + '">' + cat.items[k].label + '</div>';
      }).join('');
      return '<div class="pn">' + cat.name + '</div><div class="pr">' + items + '</div>';
    }).join('');
    palPanel.innerHTML = '<div class="hd"><span>组件 · 拖到页面里</span><button class="fold" title="收起组件面板">−</button></div><div class="bd">' + body + '</div>';
    root.appendChild(palPanel);
    palPanel.style.left = palPos.l + 'px'; palPanel.style.top = palPos.t + 'px';
    palPanel.classList.toggle('collapsed',palCollapsed);
    palPanel.onmousedown = function(e){ e.stopPropagation() };
    var hd=palPanel.querySelector('.hd'), fold=palPanel.querySelector('.fold');
    fold.textContent=palCollapsed?'＋':'−'; fold.title=palCollapsed?'展开组件面板':'收起组件面板';
    fold.onclick=function(e){
      e.stopPropagation(); palCollapsed=!palCollapsed;
      palPanel.classList.toggle('collapsed',palCollapsed);
      fold.textContent=palCollapsed?'＋':'−'; fold.title=palCollapsed?'展开组件面板':'收起组件面板';
    };
    hd.addEventListener('mousedown',function(e){
      if(e.button!==0||e.target.closest('button')) return;
      e.preventDefault(); e.stopPropagation();
      var sx=e.clientX, sy=e.clientY, r=palPanel.getBoundingClientRect();
      function mv(ev){
        palPos.l=Math.max(0,Math.min(innerWidth-palPanel.offsetWidth,r.left+ev.clientX-sx));
        palPos.t=Math.max(0,Math.min(innerHeight-36,r.top+ev.clientY-sy));
        palPanel.style.left=palPos.l+'px'; palPanel.style.top=palPos.t+'px';
      }
      function up(){ document.removeEventListener('mousemove',mv,true); document.removeEventListener('mouseup',up,true) }
      document.addEventListener('mousemove',mv,true); document.addEventListener('mouseup',up,true);
    },true);
    Array.prototype.forEach.call(palPanel.querySelectorAll('.item'), function(it){
      it.addEventListener('dragstart', function(e){
        e.dataTransfer.effectAllowed = 'copy';
        try { e.dataTransfer.setData('text/plain', it.dataset.k) } catch (x) {}
        dragKey = it.dataset.k;
      });
    });
  }
  var DROP_W = 80, DROP_H = 40;
  document.addEventListener('dragover', function(e){
    if (!emode || !dragKey) return;
    e.preventDefault();
    if (!dropHint) { dropHint = document.createElement('div'); dropHint.className = 'edit-drop'; root.appendChild(dropHint) }
    dropHint.style.left = (e.clientX - DROP_W / 2) + 'px';
    dropHint.style.top = (e.clientY - DROP_H / 2) + 'px';
    dropHint.style.width = DROP_W + 'px';
    dropHint.style.height = DROP_H + 'px';
  });
  document.addEventListener('drop', function(e){
    if (!emode || !dragKey) return;
    e.preventDefault();
    var html = TEMPLATES[dragKey];
    var cx = e.clientX, cy = e.clientY;
    dragKey = null;
    if (dropHint) { dropHint.remove(); dropHint = null }
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    var node = tmp.firstElementChild; if (!node) return;
    pushUndo();
    node.style.position = 'absolute';
    node.style.left = Math.max(0, window.scrollX + cx - DROP_W / 2) + 'px';
    node.style.top = Math.max(0, window.scrollY + cy - DROP_H / 2) + 'px';
    insertPageNode(node);
    select(node);
  });
  document.addEventListener('dragend', function(){ dragKey = null; if (dropHint) { dropHint.remove(); dropHint = null } });

  /* ---------- 时间选择器:非编辑模式下点击展开日历预览 ---------- */
  var calPop = null;
  function closeCalPopup(){ if (calPop) { calPop.remove(); calPop = null } }
  function toggleCalPopup(ctrl){
    if (calPop) { closeCalPopup(); return }
    calPop = document.createElement('div'); calPop.className = 'edit-cal-pop pe';
    calPop.innerHTML = CAL_HTML;
    root.appendChild(calPop);
    var r = ctrl.getBoundingClientRect();
    calPop.style.position = 'fixed';
    calPop.style.left = Math.max(4, r.left) + 'px';
    calPop.style.top = (r.bottom + 6) + 'px';
    calPop.style.zIndex = 100000;
  }
  document.addEventListener('click', function(e){
    if (emode) return;
    var trig = e.target.closest && e.target.closest('.dt-trigger');
    if (!trig) return;
    var ctrl = trig.closest('.edit-dtctl');
    if (!ctrl) return;
    e.preventDefault(); e.stopPropagation();
    toggleCalPopup(ctrl);
  }, true);
  document.addEventListener('mousedown', function(e){
    if (calPop && !calPop.contains(e.target) && !(e.target.closest && e.target.closest('.dt-trigger'))) closeCalPopup();
  }, true);

  /* ---------- 多页面:元素跳转 + 页面管理 ---------- */
  var PAGES_STORE_ID = 'edit-pages-data';
  var pagesStore = document.getElementById(PAGES_STORE_ID);
  var PAGES = {};
  if (pagesStore) {
    try { PAGES = JSON.parse(pagesStore.textContent || '{}') } catch (e) { PAGES = {} }
  } else {
    pagesStore = document.createElement('script');
    pagesStore.id = PAGES_STORE_ID; pagesStore.type = 'application/json';
    pagesStore.textContent = '{}';
    document.body.insertBefore(pagesStore, document.body.firstChild);
  }
  var currentPageId = document.body.dataset.editCurrentPage || '首页';
  document.body.dataset.editCurrentPage = currentPageId;

  function persistPages(){ pagesStore.textContent = JSON.stringify(PAGES) }
  function layerStartInfo(){
    var children = Array.prototype.slice.call(document.body.childNodes);
    for (var i = 0; i < children.length; i++) {
      var n = children[i];
      if (n.nodeType === 8 && /通用批注层|通用编辑层/.test(n.textContent)) return { index: i, all: children };
    }
    return null;
  }
  var PAGE_START_TEXT = '编辑页面内容开始';
  var PAGE_END_TEXT = '编辑页面内容结束';
  var pageStart = null, pageEnd = null;
  Array.prototype.forEach.call(document.body.childNodes, function(n){
    if (n.nodeType !== 8) return;
    if (n.textContent === PAGE_START_TEXT) pageStart = n;
    if (n.textContent === PAGE_END_TEXT) pageEnd = n;
  });
  if (!pageStart || !pageEnd) {
    pageStart = document.createComment(PAGE_START_TEXT);
    pageEnd = document.createComment(PAGE_END_TEXT);
    var initialLayer = layerStartInfo();
    var initialAnchor = initialLayer ? initialLayer.all[initialLayer.index] : null;
    document.body.insertBefore(pageStart, pagesStore.nextSibling);
    document.body.insertBefore(pageEnd, initialAnchor);
  }
  function insertPageNode(node){
    document.body.insertBefore(node, pageEnd);
  }
  function getPageContentHTML(){
    var tmp = document.createElement('div');
    var n = pageStart.nextSibling;
    while (n && n !== pageEnd) {
      tmp.appendChild(n.cloneNode(true));
      n = n.nextSibling;
    }
    return tmp.innerHTML;
  }
  function setPageContent(html){
    var n = pageStart.nextSibling;
    while (n && n !== pageEnd) { var next = n.nextSibling; document.body.removeChild(n); n = next }
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    while (tmp.firstChild) document.body.insertBefore(tmp.firstChild, pageEnd);
  }
  if (!PAGES.hasOwnProperty(currentPageId)) {
    var initialPages = {};
    var initialAnnoStore = document.getElementById('anno-data');
    initialPages[currentPageId] = {
      html: getPageContentHTML(),
      anno: initialAnnoStore ? initialAnnoStore.textContent : '{"pref":{"g":"常用","c":"#ff7a45"},"list":[]}'
    };
    Object.keys(PAGES).forEach(function(id){ initialPages[id] = PAGES[id] });
    PAGES = initialPages;
    persistPages();
  }
  /* ---------- 撤销 / 还原(基于整页内容快照,最多各 5 步) ---------- */
  var MAX_UNDO = 5;
  var undoStack = [], redoStack = [];
  function updateUndoRedoButtons(){
    undoBtn.disabled = !undoStack.length;
    redoBtn.disabled = !redoStack.length;
  }
  function pushUndo(){
    undoStack.push(getPageContentHTML());
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }
  function doUndo(){
    if (!undoStack.length) return;
    var cur = getPageContentHTML();
    var prev = undoStack.pop();
    redoStack.push(cur);
    if (redoStack.length > MAX_UNDO) redoStack.shift();
    deselect();
    setPageContent(prev);
    updateUndoRedoButtons();
  }
  function doRedo(){
    if (!redoStack.length) return;
    var cur = getPageContentHTML();
    var next = redoStack.pop();
    undoStack.push(cur);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    deselect();
    setPageContent(next);
    updateUndoRedoButtons();
  }
  undoBtn.onclick = doUndo;
  redoBtn.onclick = doRedo;

  var BLANK_ANNO = '{"pref":{"g":"常用","c":"#ff7a45"},"list":[]}';
  function escapeHTML(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }
  function currentAnnoDataText(){
    if (window.__annoGetData) return window.__annoGetData();
    var s = document.getElementById('anno-data');
    return s ? s.textContent : BLANK_ANNO;
  }
  function migrateLegacyTrailingPageNodes(){
    var move = [], n = pageEnd.nextSibling;
    while (n) {
      var next = n.nextSibling;
      if (n.nodeType === 1 && n.id !== 'anno-root' && n.id !== PAGES_STORE_ID &&
          !/^(STYLE|SCRIPT|LINK|META)$/i.test(n.tagName)) move.push(n);
      n = next;
    }
    move.forEach(function(node){ insertPageNode(node) });
    if (move.length) {
      PAGES[currentPageId] = { html: getPageContentHTML(), anno: currentAnnoDataText() };
      persistPages();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', migrateLegacyTrailingPageNodes, { once:true });
  else setTimeout(migrateLegacyTrailingPageNodes, 0);


  /* ---------- 持续跟随滚动 / 缩放 ---------- */
  document.addEventListener('scroll', function(){ if (esel) { drawBox(); posToolbar(); positionPanel(); positionTextPanel() } }, true);
  addEventListener('resize', function(){ if (esel) { drawBox(); posToolbar(); positionPanel(); positionTextPanel() } });
  setInterval(function(){ if (esel) { drawBox(); posToolbar() } }, 500);

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape' || !emode) return;
    if (esel && esel.getAttribute('contenteditable') === 'true') return;
    if (textPanel) { closeTextPanel(); return }
    if (panel) { closePanel(); return }
    if (esel) { deselect(); return }
    setMode(false);
  });
})();
</script>
