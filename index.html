<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Word Library</title>
    <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
    <div id="game-assets" style="display:none;">
        <video id="intro-video" playsinline muted>
            <source src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/spooky.mp4" type="video/mp4">
        </video>
        <audio id="bgm-spooky" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/spooky.MP3" loop></audio>
        <audio id="sfx-open" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/openmusic.mp3"></audio> 
        <audio id="sfx-shuffle" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/shuffle.MP3"></audio>
        <audio id="sfx-match" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/match.mp3"></audio> 
        <audio id="sfx-notmatch" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/notmatch.mp3"></audio>
        <audio id="sfx-flip" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/flip.mp3"></audio>
        <audio id="sfx-win" src="https://cdn.jsdelivr.net/gh/mengmeng0415/wordpic01/youwin.mp3"></audio>
    </div>

    <div id="game-config-modal" class="modal-overlay hidden">
        <div class="config-box">
            <h3>配置翻牌游戏</h3>
            <p>已选中 <span id="selected-count" style="color:var(--primary);font-weight:bold;">0</span> 个单词</p>
            <div class="config-row">
                <label>每组单词数：</label>
                <select id="group-size-select">
                    <option value="2">2 个 (4张牌)</option>
                    <option value="3">3 个 (6张牌)</option>
                    <option value="4">4 个 (8张牌)</option>
                    <option value="5" selected>5 个 (10张牌)</option>
                </select>
            </div>
            <div class="config-row" style="display:block; text-align:left;">
                <label style="margin-bottom:10px; display:block;">选择主题：</label>
                <div id="modal-theme-list" class="theme-selector"></div>
            </div>
            <div class="config-actions">
                <button onclick="closeConfigModal()" class="btn-cancel">取消</button>
                <button onclick="confirmGameGeneration()" class="btn-confirm">生成游戏</button>
            </div>
        </div>
    </div>

    <div id="quiz-config-modal" class="modal-overlay hidden" style="z-index: 3000;">
        <div class="config-box" style="max-width: 400px;">
            <h3>🧠 配置 AI 词义练习</h3>
            <p>已选中 <span id="quiz-selected-count" style="color:var(--primary);font-weight:bold;">0</span> 个单词</p>
            <div class="config-row">
                <label>配图设置：</label>
                <select id="quiz-img-setting">
                    <option value="show">默认显示图片 (看图猜词)</option>
                    <option value="hide">默认隐藏图片 (看字猜义)</option>
                </select>
            </div>
            <div class="config-actions">
                <button onclick="closeQuizConfigModal()" class="btn-cancel">取消</button>
                <button onclick="generateVocabQuiz()" class="btn-confirm">开始练习</button>
            </div>
        </div>
    </div>

<div id="apikey-modal" class="modal-overlay hidden" style="z-index: 3000;">
        <div class="config-box" style="max-width: 550px; width: 90%;">
            <h3 style="margin-top: 0;">⚙️ 设置 Gemini AI 引擎</h3>
            
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 14px; color: #333;">1. API Key:</label>
                <input type="password" id="api-key-input" placeholder="输入您的 Gemini API Key..." style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;">
            </div>

            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-weight: bold; font-size: 14px; color: #333;">2. 单词详解提示词 (Prompt):</label>
                <p style="font-size: 12px; color: #888; margin: 5px 0;">
                    系统会在生成时自动将 <b>{{word}}</b> 替换为实际单词。<br>
                    <span style="color:var(--red);">* 注意：请务必保留底部的 [DEF], [COLL] 等格式标签要求，否则界面将无法正确渲染。</span>
                </p>
                <textarea id="ai-prompt-input" rows="10" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; box-sizing: border-box; resize: vertical; font-family: monospace;"></textarea>
            </div>

            <div class="config-actions" style="margin-top: 20px;">
                <button onclick="closeApiKeyModal()" class="btn-cancel">取消</button>
                <button onclick="saveApiKey()" class="btn-confirm">保存设置</button>
            </div>
        </div>
    </div>

    <div id="ai-loading-overlay" class="modal-overlay hidden" style="z-index: 99999; flex-direction: column; color: white;">
        <div class="ai-spinner" style="border: 5px solid rgba(255, 255, 255, 0.2); border-top: 5px solid #fff; border-radius: 50%; width: 60px; height: 60px; animation: ai-spin 1s linear infinite;"></div>
        <p id="ai-loading-text" style="margin-top: 25px; font-weight: bold; font-size: 20px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
            🧠 AI 引擎正在思考中...
        </p>
        <style>@keyframes ai-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>

    <div id="view-home" class="page-view">
        <aside id="home-sidebar" class="sidebar home-sidebar">
            <div class="sidebar-header">
                <h2><i class="icon">📑</i> Word List <span id="home-list-count" class="list-count">(0)</span></h2>
                <div style="display:flex; gap:8px;">
                    <button class="save-btn" onclick="openApiKeyModal()" style="background:#5b67f1;" title="配置 AI 引擎">⚙️ AI</button>
                    <button class="save-btn" onclick="exportData()">💾 导出</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Search words..." autocomplete="off">
            </div>
            <div class="sidebar-filter-area">
                <div id="home-filter-stars" class="filter-stars-container"></div>
                <button id="btn-home-toggle" class="toggle-text-btn" onclick="toggleHomeList()">全部展开</button>
            </div>
            <ul id="abc-list" class="scroll-list"></ul>
        </aside>

        <main class="content-home">
            <div id="home-gallery-view">
                <div class="home-fixed-header">
                    <div class="header-left">
                        <h1>📚 Books</h1>
                        <div id="book-type-tabs" class="book-type-nav"></div>
                    </div>
                    <div class="header-right">
                        <span>按键音</span>
                        <label class="switch">
                            <input type="checkbox" id="home-sound-toggle" onchange="toggleClickSound(this)">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
                <div id="book-gallery" class="book-gallery"></div>
            </div>
        </main>
    </div>

    <div id="view-detail" class="page-view hidden">
        <aside id="chapter-sidebar" class="sidebar collapsed">
            <div class="sidebar-header">
                <h2 style="font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; color: #333;">
                    <i class="icon">📑</i> Word List 
                    <span id="chapter-list-count" class="list-count" style="font-size: 12px; color: #999; background: #f0f2f5; padding: 2px 6px; border-radius: 4px;">(0)</span>
                </h2>
            </div>
            
            <div class="search-box">
                 <input type="text" id="chapter-search" placeholder="Search in book..." autocomplete="off">
            </div>

            <div id="creation-bar" class="hidden" style="padding: 10px 15px; background: #eef2ff; border-bottom: 1px solid #e0e6ed; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                <div style="font-size: 13px; color: var(--primary); font-weight: bold;">
                    已选: <span id="sidebar-select-count">0</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="exitCreationMode()" style="padding: 6px 12px; background: #fff; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">取消</button>
                    <button onclick="openConfigModal()" style="padding: 6px 12px; background: var(--primary); color: #fff; border-radius: 4px; font-size: 12px; font-weight: bold;">下一步</button>
                </div>
            </div>

            <div class="sidebar-filter-area">
                 <div id="book-filter-stars" class="filter-stars-container"></div>
                 <button id="btn-book-toggle" class="toggle-text-btn" onclick="toggleBookList()">全部展开</button>
            </div>
            <ul id="chapter-list-container" class="scroll-list"></ul>
        </aside>

        <main class="content-detail">
            <header class="word-top-bar">
                <div class="bar-left">
                    <button id="btn-toggle-sidebar" class="icon-btn" onclick="toggleSidebar()">☰</button>
                    <button class="icon-btn home-btn" onclick="goHome()">
                        <img src="backinfo/home.png" class="home-icon-img" alt="Home">
                    </button>
                    
                    <div class="practice-dropdown" id="book-practice-container" style="display:none;">
                        <button class="practice-btn" onclick="togglePracticeMenu()">
                            <span>书本练习</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div id="practice-menu-content" class="dropdown-content"></div>
                    </div>

                    <div class="practice-dropdown" id="book-pdf-container" style="display:none;">
                        <button class="practice-btn" onclick="togglePdfMenu()" style="color: #E91E63; border-color: #f8bbd0;">
                            <span>阅读原书</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div id="pdf-menu-content" class="dropdown-content"></div>
                    </div>
                    <button id="btn-toggle-word" class="toggle-word-btn active" onclick="toggleWordVisibility()">
                        显示单词
                    </button>
                </div>

                <div class="bar-center">
                    <div class="word-row-main">
                        <h1 id="word-main">Word</h1>
                        <div class="main-audio" onclick="playCurrentWord()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </div>
                    </div>
                    <div id="rating-stars" class="rating-box"></div>
                </div>

                <div class="bar-right" id="nav-buttons">
                    <button class="nav-arrow" onclick="prevWord()">◀ PREV</button>
                    <button class="nav-arrow" onclick="nextWord()">NEXT ▶</button>
                </div>
            </header>

            <nav id="detail-tabs" class="detail-tabs"></nav>
            <div id="tab-content-area" class="tab-content-area"></div>
        </main>
    </div>

    <div id="image-modal" class="image-modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script src="app.js?v=18"></script>
</body>
</html>
