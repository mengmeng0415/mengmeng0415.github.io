<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广告组合</title>
<style>
  :root{
    --ink:#1b1f27;
    --ink-2:#5a6272;
    --ink-3:#8b93a3;
    --line:#e7e9ee;
    --field:#f6f7f9;
    --brand:#3a72f2;
    --brand-soft:#eaf0fe;
    --ok:#1f9254;
    --ok-soft:#e6f7ec;
    --warn:#b4761c;
    --warn-soft:#fdf1de;
    --danger:#d9432f;
    --danger-soft:#fdecea;
    --pink:#d6417e;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#f2f3f6;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:20px;
  }

  .page{max-width:1900px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,26,40,.06);overflow:hidden}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:28px;padding:16px 24px 0;border-bottom:1px solid var(--line)}
  .tab{font-size:15px;color:var(--ink-3);padding-bottom:14px;cursor:pointer;position:relative}
  .tab.active{color:var(--brand);font-weight:600}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px}
  .btn{
    height:34px;padding:0 16px;border-radius:6px;font-size:13px;font-family:inherit;
    cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{border-color:#c3cbd9;color:var(--ink)}
  .btn--primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn--primary:hover{background:#2f60d6}
  .btn--ghost{color:var(--ink-2)}
  .select{position:relative}
  .select .btn::after{content:"▾";font-size:10px;color:var(--ink-3);margin-left:2px}

  .input-s{
    height:34px;min-width:150px;border:1px solid var(--line);border-radius:6px;
    padding:0 12px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;
    display:flex;align-items:center;gap:8px;
  }
  .input-s input{border:0;outline:0;font-size:13px;font-family:inherit;flex:1;min-width:0;background:transparent}
  .input-s input::placeholder{color:var(--ink-3)}
  .input-s .ic{color:var(--ink-3);font-size:14px}

  .toolbar .spacer{flex:1}
  .link-btn{
    display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-2);
    background:none;border:0;cursor:pointer;padding:6px 4px;
  }
  .link-btn:hover{color:var(--brand)}

  .subbar{display:flex;align-items:center;gap:12px;padding:0 24px 16px}
  .check-inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .check-inline input{width:14px;height:14px;accent-color:var(--brand)}

  /* ---------- table ---------- */
  .table-scroll{overflow-x:auto;border-top:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;min-width:1700px;font-size:13px}
  thead th{
    position:sticky;top:0;background:var(--field);color:var(--ink-2);font-weight:500;
    text-align:left;padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line);
  }
  th .sort{display:inline-flex;flex-direction:column;margin-left:4px;vertical-align:middle;line-height:1;color:#c2c8d3;font-size:8px}
  th.new-col{background:var(--brand-soft);color:#2f57c2}
  td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;vertical-align:middle}
  tbody tr:hover{background:#fafbfd}
  td.new-col{background:#f6f9ff}

  .ck{width:15px;height:15px;accent-color:var(--brand)}
  .cell-num{font-variant-numeric:tabular-nums}
  .neg{color:#d9432f}
  .pos{color:var(--ok)}

  .badge{
    display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:99px;
    font-weight:500;border:0;font-family:inherit;
  }
  .badge--ok{background:var(--ok-soft);color:var(--ok)}
  .badge--pending{background:var(--warn-soft);color:var(--warn)}
  .badge--rejected{
    background:var(--danger-soft);color:var(--danger);cursor:pointer;gap:3px;
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  }
  .badge--rejected::after{content:"›";font-size:13px;font-weight:700;line-height:1}
  .badge--rejected:hover{background:#fbdcd6}
  .badge--none{background:var(--field);color:var(--ink-3)}

  .popover{
    position:fixed;z-index:60;width:260px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 32px rgba(20,26,40,.18);padding:14px;
  }
  .popover__title{font-size:12px;font-weight:600;color:var(--danger);margin-bottom:6px}
  .popover__reason{font-size:12px;line-height:1.6;color:var(--ink-2);margin-bottom:12px}
  .popover__actions{display:flex;justify-content:flex-end}
  .popover__actions button{
    padding:5px 14px;border-radius:6px;font-size:12px;border:0;cursor:pointer;
    background:var(--brand);color:#fff;font-family:inherit;
  }
  .popover__actions button:hover{background:#2f60d6}

  .editcell{display:flex;align-items:center;gap:6px}
  .edit-ic{
    width:22px;height:22px;border-radius:5px;border:0;background:var(--brand-soft);color:var(--brand);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex:none;
  }
  .edit-ic:hover{background:#dbe6fd}
  .editcell input{
    width:64px;height:26px;border:1px solid var(--brand);border-radius:5px;padding:0 6px;
    font-size:13px;font-family:inherit;color:var(--ink);
  }
  .editcell input:focus{outline:0;box-shadow:0 0 0 2px rgba(58,114,242,.15)}
  .ok-ic,.x-ic{
    width:22px;height:22px;border-radius:5px;border:0;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:12px;flex:none;
  }
  .ok-ic{background:var(--ok-soft);color:var(--ok)}
  .x-ic{background:#fdecea;color:#d9432f}

  .op{display:flex;gap:10px}
  .op button{
    width:26px;height:26px;border-radius:6px;border:0;background:transparent;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;
  }
  .op .ic-edit{color:var(--brand);background:var(--brand-soft)}
  .op .ic-history{color:var(--pink);background:#fbe8f1}
  .op .ic-list{color:var(--ink-2);background:var(--field)}

  tfoot td{font-weight:600;color:var(--ink);background:var(--field);border-bottom:0}

  .callout{
    position:absolute;pointer-events:none;
  }

  /* ---------- 批量操作下拉 ---------- */
  .dropdown-menu{
    position:absolute;top:calc(100% + 6px);left:0;min-width:160px;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,26,40,.16);
    padding:6px;display:none;z-index:30;
  }
  .dropdown-menu.open{display:block}
  .dropdown-item{
    padding:9px 12px;border-radius:6px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;
  }
  .dropdown-item:hover{background:var(--field);color:var(--ink)}

  /* ---------- 批量选择悬浮条 ---------- */
  .selbar{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;
    display:none;align-items:center;gap:16px;background:#1b1f27;color:#fff;
    padding:12px 16px 12px 20px;border-radius:12px;box-shadow:0 12px 32px rgba(20,26,40,.28);
    font-size:13px;
  }
  .selbar.show{display:flex}
  .selbar__count{font-weight:600}
  .selbar__hint{color:#a6adba;font-size:12px;margin-left:6px}
  .selbar button{padding:7px 16px;border-radius:8px;font-size:13px;border:0;cursor:pointer;font-family:inherit}
  .selbar__clear{background:transparent;color:#a6adba}
  .selbar__clear:hover{color:#fff}

  /* ---------- 轻提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;
    background:#1b1f27;color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;
    box-shadow:0 12px 32px rgba(20,26,40,.28);opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1}

  /* ---------- 批量审核抽屉 ---------- */
  .drawer-mask{
    position:fixed;inset:0;background:rgba(20,26,40,.4);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .drawer-mask.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:640px;max-width:92vw;background:#fff;z-index:71;
    box-shadow:-16px 0 40px rgba(20,26,40,.18);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .25s ease;
  }
  .drawer.open{transform:translateX(0)}
  .drawer__head{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--line);flex:none;
  }
  .drawer__title{font-size:16px;font-weight:600}
  .drawer__head .close{
    width:28px;height:28px;border:0;background:transparent;border-radius:6px;
    color:var(--ink-3);font-size:16px;cursor:pointer;flex:none;
  }
  .drawer__head .close:hover{background:var(--field);color:var(--ink)}
  .drawer__body{flex:1;overflow-y:auto;padding:16px 22px}
  .drawer__foot{
    display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;
    border-top:1px solid var(--line);flex:none;
  }

  .rcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .rcard__head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  .rcard__name{font-size:14px;font-weight:600}
  .rcard__meta{font-size:12px;color:var(--ink-3);margin-top:2px}
  .rcard__remove{
    width:22px;height:22px;border-radius:5px;border:0;background:var(--field);color:var(--ink-3);
    cursor:pointer;font-size:12px;flex:none;
  }
  .rcard__remove:hover{background:#fdecea;color:var(--danger)}

  .rmini{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--field);
    border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;
  }
  .rmini__label{color:var(--ink-3);margin-bottom:3px}
  .rmini__val{font-variant-numeric:tabular-nums;font-weight:600}
  .rmini__val b{color:var(--brand);font-weight:600}

  .rfield{margin-bottom:12px}
  .rfield__label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;font-weight:500}
  .rfield__label .req{color:var(--danger);margin-left:2px}
  .rradios{display:flex;gap:8px}
  .rradio{
    flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;font-size:12px;
  }
  .rradio input{accent-color:var(--brand);width:13px;height:13px;flex:none}
  .rradio:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
  .rinput-wrap{position:relative}
  .rinput-wrap .unit{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3)}
  .rinput{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 22px;
    font-size:13px;font-family:inherit;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .rinput:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(58,114,242,.12)}
  .rtextarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:13px;font-family:inherit;color:var(--ink);min-height:52px;resize:vertical;line-height:1.5;
  }
  .rtextarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(58,114,242,.12)}
  .rtextarea--error{border-color:var(--danger)}
  .rtextarea--error:focus{border-color:var(--danger);box-shadow:0 0 0 3px rgba(217,67,47,.12)}
  .rerr{display:none;font-size:12px;color:var(--danger);margin-top:6px}
  .rerr.show{display:block}

  .rremark{font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap}
  .rremark--empty{color:var(--ink-3)}

  .drawer__empty{text-align:center;color:var(--ink-3);font-size:13px;padding:60px 0}
</style>
</head>
<body>

<div class="page">

  <div class="tabs">
    <div class="tab active">广告组合</div>
    <div class="tab">报备列表</div>
  </div>

  <div class="toolbar">
    <button class="btn btn--primary">创建广告组合</button>
    <div class="select" id="batchOpsWrap">
      <button class="btn" id="batchOpsBtn" type="button">批量操作</button>
      <div class="dropdown-menu" id="batchOpsMenu">
        <div class="dropdown-item" data-action="edit-budget">修改预算额度</div>
        <div class="dropdown-item" data-action="batch-review">批量复核</div>
      </div>
    </div>
    <div class="input-s"><span class="ic">🔍</span><input type="text" placeholder="查找广告组合"></div>
    <div class="input-s"><span class="ic">☰</span><input type="text" placeholder="查找Asin"></div>
    <div class="input-s"><span class="ic">☰</span><input type="text" placeholder="查找型号"></div>
    <button class="btn">📅 2026-07-27 - 2026-07-27</button>
    <div class="select"><button class="btn">更多筛选</button></div>
    <div class="spacer"></div>
    <button class="link-btn">⇥ 导出</button>
    <button class="link-btn">⚙ 配置</button>
  </div>

  <div class="subbar">
    <label class="check-inline"><input type="checkbox">待复</label>
    <button class="btn btn--primary" style="background:var(--brand)">查询</button>
    <button class="btn">重置</button>
  </div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th style="width:36px"><input class="ck" type="checkbox" id="checkAll"></th>
          <th>广告花费<span class="sort">▲▼</span></th>
          <th>花费进度</th>
          <th>预算<span class="sort">▲▼</span></th>
          <th>预算额度状态</th>
          <th>预算调整日期</th>
          <th>预算额度<span class="sort">▲▼</span></th>
          <th class="new-col">默认预算额度</th>
          <th>剩余预算<span class="sort">▲▼</span></th>
          <th>建议</th>
          <th>概括 ⓘ</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td></td>
          <td class="cell-num">$54,420.05</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td class="cell-num">$98,928.70</td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<div class="selbar" id="selbar">
  <div><span class="selbar__count" id="selCount">0</span> 项已选择<span class="selbar__hint">从"批量操作"中选择"批量复核"</span></div>
  <button class="selbar__clear" id="selClear" type="button">取消选择</button>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer__head">
    <div class="drawer__title" id="drawerTitle">批量复核</div>
    <button class="close" id="drawerClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="drawer__body" id="drawerBody"></div>
  <div class="drawer__foot">
    <button class="btn btn--ghost" id="drawerCancel" type="button">取消</button>
    <button class="btn btn--primary" id="drawerConfirm" type="button">确认</button>
  </div>
</div>

<script>
  const rows = [
    {name:'portfolio:Harper-SP-US-新品加速',         spend:400.37, pct:'100.09%', budget:400, status:{type:'rejected', reason:'申请额度提升幅度超过安全阈值，请补充说明预算用途后重新提交'}, date:'2026-07-27...', current:400, def:350, left:-0.37,  advice:'预算8折, 重点优化', sum:'5% < 近7天转化'},
    {name:'portfolio:Dawson-LDR-DU-5链标准化测试',   spend:400.26, pct:'100.07%', budget:400, status:{type:'pending'},  date:'2026-07-28...', current:400, def:350, left:-0.26,  advice:'维持预算',           sum:'5% < 近7天转化', applicant:'王晓', applyType:'today',   applyAmount:450, remark:'大促期间流量上涨，临时提额覆盖高峰竞价'},
    {name:'portfolio:Bennett-SD-UK-收纳类目承接',    spend:387.08, pct:'38708%',  budget:1,   status:{type:'none'},    date:'2026-07-27...', current:1,   def:1,   left:-386.08,advice:'维持预算',           sum:'近7天转化率 ≤ 5...'},
    {name:'portfolio:Callahan-SP-DE-厨具引流',       spend:369.64, pct:'36964%',  budget:1,   status:{type:'ok'},      date:'2026-07-22...', current:1,   def:1,   left:-368.64,advice:'维持预算',           sum:'10% < 近7天转...'},
    {name:'portfolio:Finley-SB-US-玩具品牌曝光',     spend:352.44, pct:'35244%',  budget:1,   status:{type:'none'},    date:'2026-07-27...', current:1,   def:1,   left:-351.44,advice:'维持预算',           sum:'10% < 近7天转'},
    {name:'portfolio:Whitmore-SP-CA-户外旺季',       spend:352.01, pct:'35201%',  budget:1,   status:{type:'pending'}, date:'2026-07-27...', current:1,   def:1,   left:-351.01,advice:'维持预算',           sum:'10% < 近7天转', applicant:'李明', applyType:'default', applyAmount:50,  remark:''},
    {name:'portfolio:Sutton-SD-US-宠物复购',         spend:348.21, pct:'69.64%',  budget:500, status:{type:'ok'},      date:'2026-07-27...', current:500, def:500, left:151.79, advice:'维持预算',           sum:'10% < 近7天转'},
    {name:'portfolio:Bishop-SP-JP-耳机新品',         spend:341.12, pct:'34112%',  budget:1,   status:{type:'none'},    date:'2026-07-27...', current:1,   def:1,   left:-340.12,advice:'预算8折, 重点优化', sum:'5% < 近7天转化'},
    {name:'portfolio:Lockhart-SP-US-瑜伽垫清仓',     spend:325.24, pct:'32524%',  budget:1,   status:{type:'rejected', reason:'近7天ROI低于目标区间，暂不批准提额'}, date:'2026-07-27...', current:1,   def:1,   left:-324.24,advice:'维持预算',           sum:'10% < 近7天转'},
    {name:'portfolio:Merrick-SB-UK-保温杯品牌',      spend:304.86, pct:'30486%',  budget:1,   status:{type:'none'},    date:'2026-07-27...', current:1,   def:1,   left:-303.86,advice:'预算8折, 重点优化', sum:'5% < 近7天转化'},
    {name:'portfolio:Osgood-SP-US-智能手表主推',     spend:304.17, pct:'86.91%',  budget:350, status:{type:'ok'},      date:'2026-07-27...', current:350, def:300, left:45.83,  advice:'维持预算',           sum:'5% < 近7天转化'},
    {name:'portfolio:Vance-SP-DE-空气炸锅大促',      spend:303.18, pct:'101.06%', budget:300, status:{type:'pending'}, date:'2026-07-21...', current:300, def:300, left:-3.18,  advice:'预算8折, 重点优化', sum:'5% < 近7天转化', applicant:'张丽', applyType:'today',   applyAmount:380, remark:'测试新素材，短期加大投放力度'},
  ];

  function fmt(n){
    const num = Number(n);
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    const s = abs.toLocaleString('zh-CN', {minimumFractionDigits: Number.isInteger(abs) ? 0 : 2, maximumFractionDigits:2});
    return sign + '$' + s;
  }

  const STATUS_LABEL = {ok:'已通过', pending:'待审批', rejected:'已驳回', none:'-'};
  function statusBadge(status, rowIdx){
    if (status.type === 'rejected') {
      return `<span class="badge badge--rejected" data-act="show-reject" data-row="${rowIdx}" title="点击查看驳回原因">${STATUS_LABEL.rejected}</span>`;
    }
    return `<span class="badge badge--${status.type}">${STATUS_LABEL[status.type]}</span>`;
  }

  function editableCell(value, kind, rowIdx){
    return `
      <span class="editcell" data-kind="${kind}" data-row="${rowIdx}" data-value="${value}">
        <span class="cell-num" data-display>${fmt(value)}</span>
        <button class="edit-ic" data-act="edit" title="编辑">✎</button>
      </span>`;
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td><input class="ck row-ck" type="checkbox" data-row="${i}"></td>
      <td class="cell-num">${fmt(r.spend)}</td>
      <td class="cell-num">${r.pct}</td>
      <td class="cell-num">${fmt(r.budget)}</td>
      <td data-status-cell="${i}">${statusBadge(r.status, i)}</td>
      <td>${r.date}</td>
      <td>${editableCell(r.current, 'current', i)}</td>
      <td class="new-col">${editableCell(r.def, 'default', i)}</td>
      <td class="cell-num ${r.left < 0 ? 'neg' : 'pos'}">${r.left < 0 ? '' : ''}${fmt(r.left)}</td>
      <td>${r.advice}</td>
      <td>${r.sum}</td>
      <td>
        <div class="op">
          <button class="ic-edit" title="编辑">✎</button>
          <button class="ic-history" title="历史">🕐</button>
          <button class="ic-list" title="日志">📋</button>
        </div>
      </td>
    </tr>
  `).join('');

  // 预算额度 / 默认预算额度 列的行内编辑交互
  tbody.addEventListener('click', e => {
    const editBtn = e.target.closest('[data-act="edit"]');
    if (editBtn) {
      const wrap = editBtn.closest('.editcell');
      const val = wrap.dataset.value;
      wrap.innerHTML = `
        <input type="number" value="${val}" data-input>
        <button class="ok-ic" data-act="save" title="保存">✓</button>
        <button class="x-ic" data-act="cancel" title="取消">✕</button>`;
      wrap.querySelector('input').focus();
      return;
    }
    const saveBtn = e.target.closest('[data-act="save"]');
    if (saveBtn) {
      const wrap = saveBtn.closest('.editcell');
      const newVal = wrap.querySelector('input').value || wrap.dataset.value;
      wrap.dataset.value = newVal;
      wrap.innerHTML = `
        <span class="cell-num" data-display>${fmt(Number(newVal))}</span>
        <button class="edit-ic" data-act="edit" title="编辑">✎</button>`;
      return;
    }
    const cancelBtn = e.target.closest('[data-act="cancel"]');
    if (cancelBtn) {
      const wrap = cancelBtn.closest('.editcell');
      const val = wrap.dataset.value;
      wrap.innerHTML = `
        <span class="cell-num" data-display>${fmt(Number(val))}</span>
        <button class="edit-ic" data-act="edit" title="编辑">✎</button>`;
      return;
    }

    const rejectBadge = e.target.closest('[data-act="show-reject"]');
    if (rejectBadge) {
      showRejectPopover(rejectBadge, Number(rejectBadge.dataset.row));
    }
  });

  // “已驳回”状态：点击查看驳回原因，确认后状态回落为“-”（不再永久占用状态位）
  let openPopover = null;
  function closePopover(){
    if (openPopover) { openPopover.remove(); openPopover = null; }
  }
  function showRejectPopover(badgeEl, rowIdx){
    closePopover();
    const rect = badgeEl.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = `
      <div class="popover__title">驳回原因</div>
      <div class="popover__reason">${rows[rowIdx].status.reason}</div>
      <div class="popover__actions"><button data-act="ack-reject" data-row="${rowIdx}">我知道了</button></div>`;
    document.body.appendChild(pop);
    const top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 12);
    const left = Math.min(rect.left, window.innerWidth - pop.offsetWidth - 12);
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    openPopover = pop;
  }
  document.addEventListener('click', e => {
    if (e.target.closest('[data-act="ack-reject"]')) {
      const rowIdx = Number(e.target.closest('[data-act="ack-reject"]').dataset.row);
      rows[rowIdx].status = {type:'none'};
      document.querySelector(`[data-status-cell="${rowIdx}"]`).innerHTML = statusBadge(rows[rowIdx].status, rowIdx);
      closePopover();
      return;
    }
    if (openPopover && !e.target.closest('.popover') && !e.target.closest('[data-act="show-reject"]')) {
      closePopover();
    }
  });

  // ---------- 轻提示 ----------
  let toastTimer;
  function showToast(msg){
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ---------- 批量操作下拉 ----------
  const batchOpsBtn = document.getElementById('batchOpsBtn');
  const batchOpsMenu = document.getElementById('batchOpsMenu');
  batchOpsBtn.addEventListener('click', e => {
    e.stopPropagation();
    batchOpsMenu.classList.toggle('open');
  });
  batchOpsMenu.addEventListener('click', e => {
    const item = e.target.closest('[data-action]');
    if (!item) return;
    batchOpsMenu.classList.remove('open');
    if (item.dataset.action === 'batch-review') {
      openBatchReview();
    }
  });
  document.addEventListener('click', () => batchOpsMenu.classList.remove('open'));

  // ---------- 批量勾选 ----------
  const selected = new Set();
  const selbar = document.getElementById('selbar');
  const selCount = document.getElementById('selCount');
  const selClear = document.getElementById('selClear');
  const checkAll = document.getElementById('checkAll');

  function updateSelBar(){
    selCount.textContent = selected.size;
    selbar.classList.toggle('show', selected.size > 0);
    checkAll.checked = selected.size > 0 && selected.size === rows.length;
  }

  tbody.addEventListener('change', e => {
    const cb = e.target.closest('.row-ck');
    if (!cb) return;
    const idx = Number(cb.dataset.row);
    if (cb.checked) selected.add(idx); else selected.delete(idx);
    updateSelBar();
  });

  checkAll.addEventListener('change', e => {
    const checked = e.target.checked;
    tbody.querySelectorAll('.row-ck').forEach(cb => {
      cb.checked = checked;
      const idx = Number(cb.dataset.row);
      if (checked) selected.add(idx); else selected.delete(idx);
    });
    updateSelBar();
  });

  selClear.addEventListener('click', () => {
    selected.clear();
    tbody.querySelectorAll('.row-ck').forEach(cb => cb.checked = false);
    updateSelBar();
  });

  // ---------- 批量复核抽屉 ----------
  const drawerMask = document.getElementById('drawerMask');
  const drawer = document.getElementById('drawer');
  const drawerBody = document.getElementById('drawerBody');
  let drawerIndices = [];

  function rcardTemplate(idx){
    const r = rows[idx];
    return `
      <div class="rcard" data-card="${idx}">
        <div class="rcard__head">
          <div>
            <div class="rcard__name">${r.name}</div>
            <div class="rcard__meta">申请人：${r.applicant || '-'}</div>
          </div>
          <button class="rcard__remove" data-remove="${idx}" type="button" title="从本次批量中移除">✕</button>
        </div>

        <div class="rmini">
          <div>
            <div class="rmini__label">预算额度</div>
            <div class="rmini__val">${fmt(r.current)} → <b data-mini-current="${idx}">${fmt(r.applyAmount)}</b></div>
          </div>
          <div>
            <div class="rmini__label">默认预算额度</div>
            <div class="rmini__val">${fmt(r.def)} → <b data-mini-default="${idx}">${fmt(r.applyType === 'default' ? r.applyAmount : r.def)}</b></div>
          </div>
        </div>

        <div class="rfield">
          <div class="rfield__label">申请类型</div>
          <div class="rradios">
            <label class="rradio"><input type="radio" name="btype-${idx}" value="today" data-type="${idx}" ${r.applyType === 'today' ? 'checked' : ''}>申请修改预算额度</label>
            <label class="rradio"><input type="radio" name="btype-${idx}" value="default" data-type="${idx}" ${r.applyType === 'default' ? 'checked' : ''}>申请修改默认预算额度</label>
          </div>
        </div>

        <div class="rfield">
          <div class="rfield__label">申请额度</div>
          <div class="rinput-wrap">
            <span class="unit">$</span>
            <input class="rinput" type="number" min="0" step="10" value="${r.applyAmount}" data-amount="${idx}">
          </div>
        </div>

        <div class="rfield">
          <div class="rfield__label">备注</div>
          <div class="rremark ${r.remark ? '' : 'rremark--empty'}">${r.remark || '申请人未填写备注'}</div>
        </div>

        <div class="rfield">
          <div class="rfield__label">审核结果</div>
          <div class="rradios">
            <label class="rradio"><input type="radio" name="bresult-${idx}" value="reject" data-result="${idx}">驳回</label>
            <label class="rradio"><input type="radio" name="bresult-${idx}" value="approve" data-result="${idx}" checked>通过</label>
          </div>
        </div>

        <div class="rfield" style="margin-bottom:0">
          <div class="rfield__label">审核原因<span class="req" data-reqmark="${idx}" style="display:none">*</span></div>
          <textarea class="rtextarea" data-reason="${idx}" placeholder="选填，可补充通过说明"></textarea>
          <div class="rerr" data-reasonerr="${idx}">请填写驳回原因</div>
        </div>
      </div>`;
  }

  function renderDrawer(){
    drawerBody.innerHTML = drawerIndices.length
      ? drawerIndices.map(rcardTemplate).join('')
      : `<div class="drawer__empty">已没有可审核的申请</div>`;
  }

  function openDrawer(){
    drawerMask.classList.add('open');
    drawer.classList.add('open');
  }
  function closeDrawer(){
    drawerMask.classList.remove('open');
    drawer.classList.remove('open');
  }

  function openBatchReview(){
    drawerIndices = Array.from(selected).filter(i => rows[i].status.type === 'pending');
    if (!drawerIndices.length) {
      showToast('请先勾选待审批的广告组合');
      return;
    }
    renderDrawer();
    openDrawer();
  }

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerCancel').addEventListener('click', closeDrawer);
  drawerMask.addEventListener('click', closeDrawer);

  // 每张卡片内“申请类型/申请额度”实时联动小额度对比；“审核结果”联动“审核原因”是否必填
  drawerBody.addEventListener('input', e => {
    const amtEl = e.target.closest('[data-amount]');
    if (amtEl) refreshMini(Number(amtEl.dataset.amount));
  });
  drawerBody.addEventListener('change', e => {
    const typeEl = e.target.closest('[data-type]');
    if (typeEl) refreshMini(Number(typeEl.dataset.type));
    const resultEl = e.target.closest('[data-result]');
    if (resultEl) syncReasonRequired(Number(resultEl.dataset.result));
  });
  function refreshMini(idx){
    const card = drawerBody.querySelector(`[data-card="${idx}"]`);
    const type = card.querySelector(`[data-type="${idx}"]:checked`).value;
    const amount = card.querySelector(`[data-amount="${idx}"]`).value;
    card.querySelector(`[data-mini-current="${idx}"]`).textContent = fmt(amount);
    card.querySelector(`[data-mini-default="${idx}"]`).textContent = fmt(type === 'default' ? amount : rows[idx].def);
  }
  function syncReasonRequired(idx){
    const card = drawerBody.querySelector(`[data-card="${idx}"]`);
    const isReject = card.querySelector(`[data-result="${idx}"]:checked`).value === 'reject';
    const reqMark = card.querySelector(`[data-reqmark="${idx}"]`);
    const reasonInput = card.querySelector(`[data-reason="${idx}"]`);
    const errEl = card.querySelector(`[data-reasonerr="${idx}"]`);
    reqMark.style.display = isReject ? '' : 'none';
    reasonInput.placeholder = isReject ? '请说明驳回原因，申请人将会收到通知' : '选填，可补充通过说明';
    reasonInput.classList.remove('rtextarea--error');
    errEl.classList.remove('show');
  }

  // 从本次批量中移除单条（不做审核决定，仅退出本次批量，仍保持“待审批”）
  drawerBody.addEventListener('click', e => {
    const rm = e.target.closest('[data-remove]');
    if (!rm) return;
    const idx = Number(rm.dataset.remove);
    drawerIndices = drawerIndices.filter(i => i !== idx);
    uncheckRow(idx);
    renderDrawer();
    if (!drawerIndices.length) closeDrawer();
  });

  function uncheckRow(idx){
    selected.delete(idx);
    const cb = tbody.querySelector(`.row-ck[data-row="${idx}"]`);
    if (cb) cb.checked = false;
    updateSelBar();
  }

  function syncEditableCell(idx, kind, value){
    const wrap = tbody.querySelector(`.editcell[data-kind="${kind}"][data-row="${idx}"]`);
    if (!wrap) return;
    wrap.dataset.value = value;
    const display = wrap.querySelector('[data-display]');
    if (display) display.textContent = fmt(value);
  }

  // 每条各自独立的审核结果（默认“通过”），点击“确认”时按各自结果分别处理；驳回的必须填写审核原因
  document.getElementById('drawerConfirm').addEventListener('click', () => {
    if (!drawerIndices.length) { closeDrawer(); return; }

    let firstInvalid = null;
    drawerIndices.forEach(idx => {
      const card = drawerBody.querySelector(`[data-card="${idx}"]`);
      const result = card.querySelector(`[data-result="${idx}"]:checked`).value;
      const reasonInput = card.querySelector(`[data-reason="${idx}"]`);
      const errEl = card.querySelector(`[data-reasonerr="${idx}"]`);
      if (result === 'reject' && !reasonInput.value.trim()) {
        reasonInput.classList.add('rtextarea--error');
        errEl.classList.add('show');
        if (!firstInvalid) firstInvalid = reasonInput;
      } else {
        reasonInput.classList.remove('rtextarea--error');
        errEl.classList.remove('show');
      }
    });
    if (firstInvalid) { firstInvalid.focus(); return; }

    drawerIndices.forEach(idx => {
      const card = drawerBody.querySelector(`[data-card="${idx}"]`);
      const type = card.querySelector(`[data-type="${idx}"]:checked`).value;
      const amount = Number(card.querySelector(`[data-amount="${idx}"]`).value) || 0;
      const reason = card.querySelector(`[data-reason="${idx}"]`).value.trim();
      const result = card.querySelector(`[data-result="${idx}"]:checked`).value;
      const r = rows[idx];
      if (result === 'approve') {
        r.current = amount;
        if (type === 'default') r.def = amount;
        r.status = {type:'ok'};
        syncEditableCell(idx, 'current', r.current);
        if (type === 'default') syncEditableCell(idx, 'default', r.def);
      } else {
        r.status = {type:'rejected', reason: reason};
      }
      document.querySelector(`[data-status-cell="${idx}"]`).innerHTML = statusBadge(r.status, idx);
      uncheckRow(idx);
    });
    drawerIndices = [];
    closeDrawer();
  });
</script>
</body>
</html>
